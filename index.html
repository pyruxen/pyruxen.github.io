<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Factory V2</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --grid-line: #292e42;
            --slot-bg: #1f2335;
            --text: #c0caf5;
            --accent-green: #9ece6a;
            --accent-blue: #7aa2f7;
            --accent-red: #f7768e;
            --accent-gold: #e0af68;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- UI OVERLAYS --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%;
            pointer-events: none;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
        }

        .hud-box {
            background: rgba(26, 27, 38, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #414868;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            min-width: 200px;
        }

        .score-val { font-size: 2.2rem; font-weight: bold; color: var(--accent-gold); line-height: 1; }
        .rate-val { font-family: monospace; color: #7aa2f7; font-size: 0.9rem; margin-top: 5px; }

        .controls button {
            background: #414868; border: none; padding: 8px 16px; 
            color: white; border-radius: 6px; cursor: pointer; margin-left: 5px;
            transition: background 0.2s;
        }
        .controls button:hover { background: #565f89; }

        /* --- THE CANVAS --- */
        .viewport {
            flex: 1;
            overflow: scroll;
            position: relative;
            cursor: grab;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px), 
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .viewport:active { cursor: grabbing; }

        .world-container {
            position: relative;
            width: 8000px;
            height: 4000px;
        }

        /* --- GRID ITEMS --- */
        .node-wrapper {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .slot {
            width: 90px;
            height: 90px;
            background: var(--slot-bg);
            border: 2px solid #414868;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .slot.drag-target { border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); transform: scale(1.05); }

        /* Arrows */
        .arrow-right::after {
            content: "➜"; position: absolute; right: -28px; 
            color: #414868; font-size: 2rem; z-index: 0;
        }
        .arrow-down::after {
            content: "⬇"; position: absolute; bottom: -28px; 
            color: #414868; font-size: 2rem; z-index: 0;
        }

        /* Expand Button (+) */
        .expand-btn {
            width: 36px; height: 36px;
            background: #24283b;
            border: 2px dashed var(--accent-green);
            border-radius: 50%;
            color: var(--accent-green);
            font-size: 1.5rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            position: absolute;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .expand-btn:hover { background: var(--accent-green); color: #1a1b26; transform: scale(1.1); }
        
        .expand-cost { 
            position: absolute; top: -25px; 
            font-size: 0.75rem; color: #1a1b26; font-weight: bold; 
            background: var(--accent-green); padding: 2px 6px; border-radius: 4px;
            white-space: nowrap;
        }

        /* --- CUBES --- */
        .cube {
            width: 82px; height: 82px;
            border-radius: 8px;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
            cursor: grab; z-index: 2;
        }
        .cube:active { cursor: grabbing; }

        .cube.source { background: var(--accent-gold); color: #1a1b26; border: 2px solid #ff9e64; cursor: pointer; }
        .cube.source:active { transform: scale(0.95); }
        .cube.adder { background: var(--accent-blue); color: #1a1b26; border: 2px solid #7dcfff; }
        .cube.mult { background: var(--accent-red); color: #1a1b26; border: 2px solid #ff9e64; }

        .cube-main-val { font-size: 1.4rem; }
        .cube-sub { font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; }

        /* --- BOTTOM DOCK --- */
        .shop-dock {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 130px;
            background: #16161e;
            border-top: 1px solid #414868;
            display: flex; justify-content: center; align-items: center; gap: 30px;
            z-index: 100;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }

        .shop-item {
            display: flex; flex-direction: column; align-items: center;
            cursor: grab; transition: transform 0.1s;
        }
        .shop-item:hover { transform: translateY(-5px); }
        
        .shop-icon {
            width: 60px; height: 60px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #1a1b26; font-size: 1.5rem;
            margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .cost-pill { background: #24283b; color: var(--accent-gold); padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; border: 1px solid #414868; }

    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="hud-box">
            <div id="score" class="score-val">0</div>
            <div id="rate" class="rate-val">Yield: 1</div>
        </div>
        <div class="hud-box controls">
            <button onclick="saveGame()">Save</button>
            <button onclick="resetGame()">Reset</button>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="world-container" id="world">
            </div>
    </div>

    <div class="shop-dock">
        <div class="shop-item" draggable="true" ondragstart="dragStartShop(event, 'adder')">
            <div class="shop-icon" style="background: var(--accent-blue);">+</div>
            <span class="cost-pill" id="cost-adder">25</span>
        </div>
        <div class="shop-item" draggable="true" ondragstart="dragStartShop(event, 'mult')">
            <div class="shop-icon" style="background: var(--accent-red);">x</div>
            <span class="cost-pill" id="cost-mult">100</span>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const CELL_SIZE = 120; 
        const CENTER_X = 4000; 
        const CENTER_Y = 2000; 
        
        // Stats: Base value + (Growth * (Level-1))
        const STATS = {
            adder: { base: 1, growth: 1 },
            mult: { base: 1.1, growth: 0.1 }
        };

        // --- GAME STATE ---
        let game = {
            score: 0,
            costs: { adder: 25, mult: 100 },
            
            // Grid System: Key "x,y" (x is negative left, y is positive up)
            grid: {
                "0,0": { unlocked: true, cube: { type: 'source', level: 1 } }
            }
        };

        // --- UI REFS ---
        const ui = {
            world: document.getElementById('world'),
            viewport: document.getElementById('viewport'),
            score: document.getElementById('score'),
            rate: document.getElementById('rate'),
            costs: {
                adder: document.getElementById('cost-adder'),
                mult: document.getElementById('cost-mult')
            }
        };

        // --- MATH ENGINE ---

        function calculateYield() {
            // Organize grid into Columns (X) containing Rows (Y)
            let columns = {};
            let minX = 0;

            for (let key in game.grid) {
                let [x, y] = key.split(',').map(Number);
                if (!columns[x]) columns[x] = [];
                columns[x].push({ y, cube: game.grid[key].cube });
                if (x < minX) minX = x;
            }

            // The "Stream" starts at 0 value from the far left
            let currentFlow = 0;

            // Iterate from Leftmost Node -> Right (towards Source at 0)
            for (let x = minX; x <= 0; x++) {
                if (!columns[x]) {
                    // Gap in the line? Flow continues unchanged.
                    continue; 
                }

                // 1. Calculate Branch Value (Vertical Logic)
                // We assume branches feed DOWN into the main node at Y=0
                // We only care about cubes, not empty slots
                
                let branchAdd = 0;
                let branchMult = 1;

                // Sort Y descending (Top -> Bottom)
                columns[x].sort((a,b) => b.y - a.y);
                
                let mainNode = null;

                columns[x].forEach(node => {
                    if (!node.cube) return;

                    if (node.y > 0) {
                        // This is a branch item
                        // For simplicity in this logic: All branch items combine
                        // to modify the Main Node.
                        // Adders add to branch power, Mults multiply branch power.
                        let p = getPower(node.cube);
                        if (node.cube.type === 'mult') branchMult *= p;
                        else branchAdd += p;
                    } else if (node.y === 0) {
                        mainNode = node.cube;
                    }
                });

                // 2. Apply Main Node Logic
                if (mainNode) {
                    if (mainNode.type === 'source') {
                        // Source adds its base to whatever flow reached it
                        currentFlow += mainNode.level;
                    } else {
                        // Regular Machine
                        let nodeBase = getPower(mainNode);
                        
                        // Apply Branch Effects to this Node's Power
                        // (Logic: Branch multipliers boost the Node's base effectiveness)
                        let totalNodeEffect = (nodeBase + branchAdd) * branchMult;

                        // Apply Node to Stream
                        if (mainNode.type === 'mult') {
                             currentFlow *= totalNodeEffect;
                        } else {
                             currentFlow += totalNodeEffect;
                        }
                    }
                }
            }

            return currentFlow;
        }

        function getPower(cube) {
            if (cube.type === 'adder') return STATS.adder.base + (STATS.adder.growth * (cube.level - 1));
            if (cube.type === 'mult') return STATS.mult.base + (STATS.mult.growth * (cube.level - 1));
            return cube.level;
        }

        // --- EXPANSION COST LOGIC ---
        function getExpansionCost(x, y) {
            const baseCost = 50;
            
            if (y === 0) {
                // Main Line (Leftward expansion)
                // Cost scales moderately: 50 * (distance^1.5)
                let dist = Math.abs(x);
                return Math.floor(baseCost * Math.pow(dist, 1.5)) + baseCost;
            } else {
                // Branch (Upward expansion)
                // Cost scales STEEPLY: 4 * y^2 relative to below?
                // Let's use a simpler polynomial that feels steep.
                return Math.floor(baseCost * Math.pow(y + 1, 2.8));
            }
        }

        function unlockSlot(x, y) {
            let cost = getExpansionCost(x, y);
            if (game.score >= cost) {
                game.score -= cost;
                game.grid[`${x},${y}`] = { unlocked: true, cube: null };
                renderWorld();
                updateUI();
            }
        }

        // --- CORE ACTIONS ---

        function clickSource() {
            let val = calculateYield();
            game.score += val;
            
            const src = document.querySelector('.cube.source');
            if(src) {
                src.style.transform = "scale(0.9)";
                setTimeout(()=>src.style.transform = "scale(1)", 100);
            }
            updateUI();
        }

        // --- RENDER ---

        function renderWorld() {
            ui.world.innerHTML = '';

            // 1. Render Slots & Cubes
            for (let key in game.grid) {
                const [x, y] = key.split(',').map(Number);
                const cell = game.grid[key];

                const wrapper = document.createElement('div');
                wrapper.className = 'node-wrapper';
                // X goes negative (left), Y goes positive (up)
                wrapper.style.left = (CENTER_X + (x * CELL_SIZE)) + 'px';
                wrapper.style.bottom = (CENTER_Y + (y * CELL_SIZE)) + 'px';

                const slot = document.createElement('div');
                slot.className = 'slot';
                
                // Visual Connectors
                if (y === 0 && x !== 0) slot.classList.add('arrow-right');
                if (y > 0) slot.classList.add('arrow-down');

                // Drag Logic
                slot.ondragover = (e) => { e.preventDefault(); slot.classList.add('drag-target'); };
                slot.ondragleave = () => slot.classList.remove('drag-target');
                slot.ondrop = (e) => handleDrop(e, x, y);

                // Render Cube if exists
                if (cell.cube) {
                    const cube = document.createElement('div');
                    cube.className = `cube ${cell.cube.type}`;
                    cube.draggable = (cell.cube.type !== 'source');
                    cube.ondragstart = (e) => dragStartGrid(e, x, y);
                    if (cell.cube.type === 'source') cube.onclick = clickSource;

                    // INFORMATIVE TEXT
                    let mainTxt = "";
                    let subTxt = `Lv ${cell.cube.level}`;
                    
                    if(cell.cube.type==='source') {
                        mainTxt = "⚡";
                    } else if(cell.cube.type==='adder') {
                        let val = getPower(cell.cube);
                        mainTxt = `+${val}`;
                    } else if(cell.cube.type==='mult') {
                        let val = getPower(cell.cube).toFixed(1);
                        mainTxt = `x${val}`;
                    }

                    cube.innerHTML = `<span class="cube-main-val">${mainTxt}</span><span class="cube-sub">${subTxt}</span>`;
                    slot.appendChild(cube);
                }

                wrapper.appendChild(slot);
                ui.world.appendChild(wrapper);
            }

            // 2. Render Expansion (+) Buttons
            // Scan for valid expansion points
            let expansionPoints = new Set();
            for (let key in game.grid) {
                const [x, y] = key.split(',').map(Number);
                
                // Left on main line
                if (y === 0) expansionPoints.add(`${x-1},0`);
                
                // Up on branch (Avoid Source Branching)
                if (!(x === 0 && y >= 0)) {
                    expansionPoints.add(`${x},${y+1}`);
                }
            }

            expansionPoints.forEach(key => {
                if (game.grid[key]) return; // Slot already exists

                const [x, y] = key.split(',').map(Number);
                const cost = getExpansionCost(x, y);

                const btn = document.createElement('div');
                btn.className = 'expand-btn';
                btn.innerHTML = `+<div class="expand-cost">$${cost}</div>`;
                btn.onclick = () => unlockSlot(x, y);
                
                btn.style.left = (CENTER_X + (x * CELL_SIZE) + 32) + 'px'; // Center in 100px gap
                btn.style.bottom = (CENTER_Y + (y * CELL_SIZE) + 32) + 'px';
                
                ui.world.appendChild(btn);
            });
        }

        // --- DRAG AND DROP ---

        function dragStartShop(e, type) {
            e.dataTransfer.setData("source", "shop");
            e.dataTransfer.setData("type", type);
        }

        function dragStartGrid(e, x, y) {
            e.dataTransfer.setData("source", "grid");
            e.dataTransfer.setData("origin", `${x},${y}`);
        }

        function handleDrop(e, x, y) {
            e.preventDefault();
            e.target.closest('.slot').classList.remove('drag-target');
            
            const source = e.dataTransfer.getData("source");
            const targetKey = `${x},${y}`;
            const targetCell = game.grid[targetKey];

            if (source === "shop") {
                const type = e.dataTransfer.getData("type");
                buyAndPlace(type, targetKey);
            } 
            else if (source === "grid") {
                const originKey = e.dataTransfer.getData("origin");
                if (originKey === targetKey) return;
                moveOrMerge(originKey, targetKey);
            }
        }

        function buyAndPlace(type, key) {
            const cost = game.costs[type];
            const cell = game.grid[key];

            // If occupied, check for merge/upgrade (same type)
            if (cell.cube) {
                if (cell.cube.type === type && game.score >= cost) {
                    game.score -= cost;
                    game.costs[type] = Math.ceil(game.costs[type] * 1.3);
                    cell.cube.level++;
                    updateUI();
                    renderWorld();
                }
                return;
            }

            // Buy new
            if (game.score >= cost) {
                game.score -= cost;
                game.costs[type] = Math.ceil(game.costs[type] * 1.3);
                cell.cube = { type: type, level: 1 };
                updateUI();
                renderWorld();
            }
        }

        function moveOrMerge(originKey, targetKey) {
            const originCell = game.grid[originKey];
            const targetCell = game.grid[targetKey];
            
            if (!originCell.cube) return;

            if (!targetCell.cube) {
                // Move
                targetCell.cube = originCell.cube;
                originCell.cube = null;
            } else {
                // Interact
                if (originCell.cube.type === targetCell.cube.type) {
                    // Merge (Sum Levels)
                    targetCell.cube.level += originCell.cube.level;
                    originCell.cube = null;
                } else {
                    // Swap
                    let temp = targetCell.cube;
                    targetCell.cube = originCell.cube;
                    originCell.cube = temp;
                }
            }
            renderWorld();
            updateUI();
        }

        function updateUI() {
            ui.score.textContent = Math.floor(game.score);
            ui.rate.textContent = `Yield: ${calculateYield().toFixed(1)}`;
            ui.costs.adder.textContent = game.costs.adder;
            ui.costs.mult.textContent = game.costs.mult;
        }

        // --- SAVE SYSTEM ---
        function saveGame() {
            localStorage.setItem('FishboneV2Save', JSON.stringify(game));
            // Visual feedback
            const btn = document.querySelector('.controls button');
            let orig = btn.innerText;
            btn.innerText = "Saved!";
            setTimeout(() => btn.innerText = orig, 1000);
        }

        function resetGame() {
            if(confirm("Reset everything?")) {
                localStorage.removeItem('FishboneV2Save');
                location.reload();
            }
        }

        function loadGame() {
            const d = localStorage.getItem('FishboneV2Save');
            if(d) game = JSON.parse(d);
            renderWorld();
            updateUI();
        }

        // --- INIT ---
        window.onload = () => {
            loadGame();
            // Center Viewport
            ui.viewport.scrollLeft = CENTER_X - (window.innerWidth / 2) + 50;
            ui.viewport.scrollTop = (4000 - CENTER_Y) - (window.innerHeight / 2);
        };

    </script>
</body>
</html>
