<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Factory V6 (Optimized)</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --grid-line: #292e42;
            --slot-bg: #1f2335;
            --text: #c0caf5;
            --accent-green: #9ece6a;
            --accent-blue: #7aa2f7;
            --accent-red: #f7768e;
            --accent-gold: #e0af68;
            --accent-purple: #bb9af7;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- HUD --- */
        .hud-top {
            height: 80px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            background: #16161e;
            border-bottom: 1px solid #414868;
            z-index: 50;
        }

        .hud-left { display: flex; gap: 10px; }
        .hud-right { }

        .score-box {
            background: rgba(26, 27, 38, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #414868;
            text-align: right;
            min-width: 150px;
        }
        .score-val { font-size: 2rem; font-weight: bold; color: var(--accent-gold); line-height: 1; }
        .rate-val { font-family: monospace; color: #7aa2f7; font-size: 0.9rem; }

        /* --- BUTTONS --- */
        .icon-btn {
            width: 50px; height: 50px;
            background: #24283b;
            border: 2px solid #414868;
            border-radius: 8px;
            color: white; font-size: 1.5rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }
        .icon-btn:hover { background: #414868; }

        #boost-btn {
            width: auto; padding: 0 15px;
            background: #1a1b26;
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            font-weight: bold; font-size: 1rem;
            position: relative; overflow: hidden;
        }
        #boost-btn.active { background: var(--accent-purple); color: #1a1b26; box-shadow: 0 0 15px var(--accent-purple); }
        #boost-btn:disabled { opacity: 0.7; cursor: not-allowed; border-color: #565f89; color: #565f89; background: #1a1b26; box-shadow: none; }

        /* --- VIEWPORT --- */
        .viewport {
            flex: 1;
            overflow: auto;
            position: relative; 
            cursor: grab;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .viewport:active { cursor: grabbing; }
        
        .world-container { position: relative; width: 20000px; height: 10000px; }

        /* --- NODES --- */
        .node-wrapper { position: absolute; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; z-index: 10; }
        
        .slot {
            width: 90px; height: 90px; background: var(--slot-bg);
            border: 2px solid #414868; border-radius: 12px; position: relative;
            display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        
        .slot * { pointer-events: none; } 
        .slot.drag-target { border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); transform: scale(1.05); }

        .arrow-right::after { content: "➜"; position: absolute; right: -28px; color: #414868; font-size: 2rem; z-index: 0; }
        .arrow-down::after { content: "⬇"; position: absolute; bottom: -28px; color: #414868; font-size: 2rem; z-index: 0; }

        .expand-btn {
            width: 36px; height: 36px; background: #24283b;
            border: 2px dashed var(--accent-green); border-radius: 50%;
            color: var(--accent-green); font-size: 1.5rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: absolute; z-index: 15; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .expand-btn:hover { background: var(--accent-green); color: #1a1b26; transform: scale(1.1); }
        .expand-cost { pointer-events: none; position: absolute; top: -25px; font-size: 0.75rem; color: #1a1b26; background: var(--accent-green); padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-weight: bold;}
        
        /* --- CUBES --- */
        .cube {
            width: 82px; height: 82px; border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-weight: bold; box-shadow: 0 5px 10px rgba(0,0,0,0.4); cursor: grab; z-index: 20;
            pointer-events: auto;
        }
        .cube.source { background: var(--accent-gold); color: #1a1b26; border: 2px solid #ff9e64; cursor: pointer; }
        .cube.source:active { transform: scale(0.95); }
        .cube.adder { background: var(--accent-blue); color: #1a1b26; border: 2px solid #7dcfff; }
        .cube.mult { background: var(--accent-red); color: #1a1b26; border: 2px solid #ff9e64; }
        .cube-main-val { font-size: 1.4rem; }
        .cube-sub { font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; }

        /* --- DOCK --- */
        .shop-dock {
            height: 130px;
            background: #16161e; border-top: 1px solid #414868;
            display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 100;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }
        .shop-item { display: flex; flex-direction: column; align-items: center; cursor: grab; transition: transform 0.1s; }
        .shop-item:hover { transform: translateY(-5px); }
        .shop-icon {
            width: 60px; height: 60px; border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #1a1b26; font-size: 1.5rem; margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .cost-pill { background: #24283b; color: var(--accent-gold); padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; border: 1px solid #414868; }

        /* --- MENU --- */
        .menu-overlay {
            position: absolute; top: 0; left: 0; height: 100vh; width: 350px;
            background: #16161e;
            border-right: 1px solid #414868;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            display: flex; flex-direction: column;
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }
        .menu-overlay.open { transform: translateX(0); }
        .menu-header { padding: 20px; border-bottom: 1px solid #414868; display: flex; justify-content: space-between; align-items: center; }
        .menu-content { padding: 20px; overflow-y: auto; flex: 1; }
        .eq-box { background: #0f0f14; padding: 15px; border-radius: 8px; font-family: monospace; color: var(--accent-green); font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; margin-bottom: 20px; border: 1px dashed #414868; }
        .full-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: #24283b; border: 1px solid #414868; color: var(--text); border-radius: 6px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; }
        .full-btn:hover { background: #414868; }
        .full-btn span { color: var(--accent-gold); }

    </style>
</head>
<body>

    <div class="hud-top">
        <div class="hud-left">
            <button class="icon-btn" onclick="toggleMenu()">☰</button>
            <button id="boost-btn" class="icon-btn" onclick="activateBoost()">
                🚀
            </button>
        </div>
        <div class="hud-right">
            <div class="score-box">
                <div id="score" class="score-val">0</div>
                <div id="rate" class="rate-val">Yield: 1</div>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menu">
        <div class="menu-header">
            <h3>Factory OS</h3>
            <button class="icon-btn" style="width: 30px; height: 30px; font-size: 1rem;" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-content">
            <div style="margin-bottom: 30px;">
                <div style="font-size: 0.75rem; color: #565f89; margin-bottom: 10px; font-weight: bold;">EQUATION</div>
                <div class="eq-box" id="equation-text">(Source)</div>
            </div>
            <div style="margin-bottom: 30px;">
                <div style="font-size: 0.75rem; color: #565f89; margin-bottom: 10px; font-weight: bold;">UPGRADES</div>
                <button class="full-btn" onclick="upgradeAutoMult()">
                    <div><strong>Auto-Multiplier</strong><br><small id="auto-rate-desc">x0.5 / sec</small></div>
                    <span id="auto-rate-cost">$500</span>
                </button>
            </div>
            <div>
                <div style="font-size: 0.75rem; color: #565f89; margin-bottom: 10px; font-weight: bold;">SYSTEM</div>
                <button class="full-btn" onclick="saveGame()">Save Game</button>
                <button class="full-btn" style="border-color: #f7768e; color: #f7768e;" onclick="resetGame()">Reset Factory</button>
            </div>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="world-container" id="world"></div>
    </div>

    <div class="shop-dock">
        <div class="shop-item" draggable="true" ondragstart="dragStartShop(event, 'adder')">
            <div class="shop-icon" style="background: var(--accent-blue);">+</div>
            <span class="cost-pill" id="cost-adder">25</span>
        </div>
        <div class="shop-item" draggable="true" ondragstart="dragStartShop(event, 'mult')">
            <div class="shop-icon" style="background: var(--accent-red);">x</div>
            <span class="cost-pill" id="cost-mult">100</span>
        </div>
    </div>

    <script>
        const CELL_SIZE = 120; 
        const CENTER_X = 10000; 
        const CENTER_Y = 5000; 
        const STATS = { adder: { base: 1, growth: 1 }, mult: { base: 1.1, growth: 0.1 } };
        const BOOST_DURATION = 30000; 
        const BOOST_COOLDOWN = 1800000;

        let game = {
            score: 0,
            costs: { adder: 25, mult: 100 },
            // CHANGED: autoMult instead of autoRate
            autoMult: 0.5, 
            autoCost: 500,
            lastBoost: 0,
            grid: { "0,0": { unlocked: true, cube: { type: 'source', level: 1 } } }
        };

        let boostActive = false;

        const ui = {
            world: document.getElementById('world'),
            viewport: document.getElementById('viewport'),
            score: document.getElementById('score'),
            rate: document.getElementById('rate'),
            eqText: document.getElementById('equation-text'),
            boostBtn: document.getElementById('boost-btn'),
            menu: document.getElementById('menu'),
            autoDesc: document.getElementById('auto-rate-desc'),
            autoCost: document.getElementById('auto-rate-cost'),
            costs: { adder: document.getElementById('cost-adder'), mult: document.getElementById('cost-mult') }
        };

        // --- OPTIMIZED GAME LOOP (1 Second Tick) ---
        setInterval(() => {
            // Calculate Base Yield
            let yieldVal = calculateYield();
            
            // Apply Auto Multiplier
            let totalToAdd = yieldVal * game.autoMult;

            // Apply Boost (10x Multiplier) if active
            if(boostActive) {
                totalToAdd *= 10;
            }

            // Add to score
            if (totalToAdd > 0) {
                game.score += totalToAdd;
                
                // Visual pop
                const src = document.querySelector('.cube.source');
                if(src) { src.style.transform = "scale(0.95)"; setTimeout(()=>src.style.transform="scale(1)", 100); }
                
                updateUI();
            }

            updateBoostBtn();

        }, 1000); // Runs once every 1000ms (1 second)

        // --- LOGIC ---
        function calculateYield() {
            let cols = {};
            let minX = 0;
            for(let k in game.grid) {
                let [x,y] = k.split(',').map(Number);
                if(!cols[x]) cols[x] = [];
                cols[x].push({y, cube: game.grid[k].cube});
                if(x < minX) minX = x;
            }

            let flow = 0;
            for(let x=minX; x<=0; x++) {
                if(!cols[x]) continue;
                cols[x].sort((a,b) => b.y - a.y);
                let branchAdd=0, branchMult=1, main=null;
                
                cols[x].forEach(n => {
                    if(!n.cube) return;
                    if(n.y > 0) {
                         let p = getPower(n.cube);
                         if(n.cube.type==='mult') branchMult *= p; else branchAdd += p;
                    } else if(n.y === 0) main = n.cube;
                });

                if(main) {
                    if(main.type==='source') flow += main.level;
                    else {
                        let base = getPower(main);
                        let effect = (base + branchAdd) * branchMult;
                        if(main.type==='mult') flow *= effect; else flow += effect;
                    }
                }
            }
            return flow;
        }

        function getEquationString() {
            return `Yield: ${calculateYield().toFixed(1)}`; 
        }

        function getPower(c) {
            if(c.type==='adder') return STATS.adder.base + (STATS.adder.growth*(c.level-1));
            if(c.type==='mult') return STATS.mult.base + (STATS.mult.growth*(c.level-1));
            return c.level;
        }

        function getExpCost(x,y) {
            let base = 50;
            if(y===0) return Math.floor(base * Math.pow(Math.abs(x), 1.5)) + base;
            return Math.floor(base * Math.pow(y+1, 2.8));
        }

        // --- INTERACTION ---
        function unlockSlot(x,y) {
            let cost = getExpCost(x,y);
            if(game.score >= cost) {
                game.score -= cost;
                game.grid[`${x},${y}`] = {unlocked:true, cube:null};
                renderWorld();
                updateUI();
            }
        }

        function upgradeAutoMult() {
            if(game.score >= game.autoCost) {
                game.score -= game.autoCost;
                game.autoMult *= 2; // Doubles the multiplier
                game.autoCost *= 3;
                updateUI();
            }
        }

        function activateBoost() {
            if(boostActive || Date.now() - game.lastBoost < BOOST_COOLDOWN) return;
            game.lastBoost = Date.now();
            boostActive = true;
            ui.boostBtn.classList.add('active');
            // Just update UI state, the loop handles the math
            setTimeout(() => { boostActive = false; ui.boostBtn.classList.remove('active'); updateBoostBtn(); }, BOOST_DURATION);
        }

        function updateBoostBtn() {
            if(boostActive) { ui.boostBtn.innerHTML = "🚀 ACTIVE!"; return; }
            let rem = BOOST_COOLDOWN - (Date.now() - game.lastBoost);
            if(rem <= 0) { ui.boostBtn.disabled=false; ui.boostBtn.innerHTML="🚀 BOOST"; }
            else { ui.boostBtn.disabled=true; ui.boostBtn.innerHTML=`⏳ ${Math.ceil(rem/60000)}m`; }
        }

        function toggleMenu() {
            ui.menu.classList.toggle('open');
            if(ui.menu.classList.contains('open')) ui.eqText.innerText = `Current Yield: ${calculateYield().toFixed(2)}`;
        }

        function renderWorld() {
            ui.world.innerHTML = '';
            
            // Render Slots
            for(let k in game.grid) {
                let [x,y] = k.split(',').map(Number);
                let cell = game.grid[k];
                
                let wrap = document.createElement('div');
                wrap.className = 'node-wrapper';
                wrap.style.left = (CENTER_X + (x*CELL_SIZE)) + 'px';
                wrap.style.bottom = (CENTER_Y + (y*CELL_SIZE)) + 'px';
                
                let slot = document.createElement('div');
                slot.className = 'slot';
                if(y===0 && x!==0) slot.classList.add('arrow-right');
                if(y>0) slot.classList.add('arrow-down');
                
                // EVENTS
                slot.ondragover = (e) => { e.preventDefault(); slot.classList.add('drag-target'); };
                slot.ondragleave = () => slot.classList.remove('drag-target');
                slot.ondrop = (e) => handleDrop(e, x, y);

                if(cell.cube) {
                    let c = document.createElement('div');
                    c.className = `cube ${cell.cube.type}`;
                    c.draggable = cell.cube.type !== 'source';
                    c.ondragstart = (e) => { e.dataTransfer.setData('src','grid'); e.dataTransfer.setData('k',k); };
                    
                    let txt = cell.cube.type==='source' ? "⚡" : (cell.cube.type==='adder' ? `+${getPower(cell.cube)}` : `x${getPower(cell.cube).toFixed(1)}`);
                    c.innerHTML = `<span class="cube-main-val">${txt}</span><span class="cube-sub">Lv ${cell.cube.level}</span>`;
                    if(cell.cube.type==='source') c.onclick = () => { game.score += calculateYield(); updateUI(); };
                    slot.appendChild(c);
                }
                wrap.appendChild(slot);
                ui.world.appendChild(wrap);
            }

            // Render Expansions
            let seen = new Set(Object.keys(game.grid));
            let potential = new Set();
            for(let k in game.grid) {
                let [x,y] = k.split(',').map(Number);
                if(y===0) potential.add(`${x-1},0`);
                if(!(x===0 && y>=0)) potential.add(`${x},${y+1}`);
            }
            
            potential.forEach(k => {
                if(seen.has(k)) return;
                let [x,y] = k.split(',').map(Number);
                let btn = document.createElement('div');
                btn.className = 'expand-btn';
                btn.innerHTML = `+<div class="expand-cost">$${getExpCost(x,y)}</div>`;
                btn.onclick = () => unlockSlot(x,y);
                btn.style.left = (CENTER_X + (x*CELL_SIZE)+32) + 'px';
                btn.style.bottom = (CENTER_Y + (y*CELL_SIZE)+32) + 'px';
                ui.world.appendChild(btn);
            });
        }

        // --- DRAG DROP ---
        function dragStartShop(e, type) { e.dataTransfer.setData('src','shop'); e.dataTransfer.setData('type',type); }
        
        function handleDrop(e, x, y) {
            e.preventDefault();
            e.target.closest('.slot').classList.remove('drag-target');
            let src = e.dataTransfer.getData('src');
            let key = `${x},${y}`;
            let cell = game.grid[key];

            if(src === 'shop') {
                let type = e.dataTransfer.getData('type');
                let cost = game.costs[type];
                
                // Upgrade/Merge logic on buy
                if(cell.cube && cell.cube.type === type) {
                    if(game.score >= cost) {
                        game.score -= cost;
                        game.costs[type] = Math.ceil(game.costs[type]*1.3);
                        cell.cube.level++;
                        renderWorld(); updateUI();
                    }
                } else if (!cell.cube && game.score >= cost) {
                    game.score -= cost;
                    game.costs[type] = Math.ceil(game.costs[type]*1.3);
                    cell.cube = {type, level:1};
                    renderWorld(); updateUI();
                }
            } else if (src === 'grid') {
                let oldK = e.dataTransfer.getData('k');
                if(oldK === key) return;
                let oldCell = game.grid[oldK];
                
                if(!cell.cube) {
                    // Move
                    cell.cube = oldCell.cube;
                    oldCell.cube = null;
                } else if (cell.cube.type === oldCell.cube.type) {
                    // Merge
                    cell.cube.level += oldCell.cube.level;
                    oldCell.cube = null;
                } else {
                    // Swap
                    let tmp = cell.cube;
                    cell.cube = oldCell.cube;
                    oldCell.cube = tmp;
                }
                renderWorld(); updateUI();
            }
        }

        function updateUI() {
            ui.score.textContent = Math.floor(game.score);
            ui.rate.textContent = `Yield: ${calculateYield().toFixed(1)}`;
            ui.costs.adder.textContent = game.costs.adder;
            ui.costs.mult.textContent = game.costs.mult;
            ui.autoDesc.textContent = `x${game.autoMult} / sec`;
            ui.autoCost.textContent = `$${game.autoCost}`;
        }

        function saveGame() { localStorage.setItem('FV6', JSON.stringify(game)); alert("Saved"); }
        function resetGame() { if(confirm("Reset?")) { localStorage.removeItem('FV6'); location.reload(); } }
        
        window.onload = () => {
            let d = localStorage.getItem('FV6');
            if(d) game = JSON.parse(d);
            // Default check for variable switch
            if(game.autoMult === undefined) game.autoMult = 0.5;
            if(!game.autoCost) game.autoCost=500;
            renderWorld(); updateUI(); updateBoostBtn();
            // Center
            ui.viewport.scrollLeft = CENTER_X - window.innerWidth/2;
            ui.viewport.scrollTop = 10000 - CENTER_Y - window.innerHeight/2;
        }
    </script>
</body>
</html>
