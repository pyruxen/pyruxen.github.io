<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Grid Idle</title>
    <style>
        :root {
            --bg-color: #181825;
            --panel-bg: #313244;
            --grid-bg: #1e1e2e;
            --text-main: #cdd6f4;
            --accent-gold: #f9e2af;
            --accent-blue: #89b4fa;
            --accent-red: #f38ba8;
            --accent-green: #a6e3a1;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR (SHOP & INFO) */
        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        h1 { font-size: 1.5rem; margin-top: 0; color: var(--accent-gold); }
        .score-box { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; }
        .rate-box { font-size: 0.9rem; opacity: 0.7; margin-bottom: 20px; font-family: monospace; }

        .btn {
            background-color: #45475a;
            color: white;
            border: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn:hover:not(:disabled) { background-color: #585b70; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn small { color: var(--accent-gold); }

        .btn-tool {
            text-align: center; 
            justify-content: center; 
            font-weight: bold;
            border: 2px solid transparent;
        }
        .btn-tool.active { border-color: var(--accent-green); background-color: #384d48; }

        .controls { margin-top: auto; display: flex; gap: 10px; }
        .controls button { flex: 1; padding: 10px; background: #45475a; border: none; color: white; cursor: pointer; }

        /* MAIN AREA */
        .viewport {
            flex: 1;
            position: relative;
            background-color: var(--grid-bg);
            background-image: radial-gradient(#313244 1px, transparent 1px);
            background-size: 20px 20px; /* Grid dots */
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG LAYER (WIRES) */
        #connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to cubes */
            z-index: 1;
        }

        /* THE GRID ITEMS */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 90px);
            grid-template-rows: repeat(6, 90px);
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        .cell {
            width: 90px;
            height: 90px;
            background-color: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 8px;
            position: relative;
        }

        .cube {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            position: relative;
            user-select: none;
        }

        .cube:hover { transform: scale(1.05); z-index: 10; }
        .cube:active { transform: scale(0.95); }

        /* CUBE TYPES */
        .cube.source { background: var(--accent-gold); color: #1e1e2e; border: 2px solid #fab387; }
        .cube.adder { background: var(--accent-blue); color: #1e1e2e; border: 2px solid #74c7ec; }
        .cube.mult { background: var(--accent-red); color: #1e1e2e; border: 2px solid #eba0ac; }

        /* Badges */
        .val { font-size: 1.5rem; font-weight: bold; }
        .lbl { font-size: 0.7rem; text-transform: uppercase; margin-top: -5px; }
        .lvl { 
            position: absolute; top: 4px; right: 4px; 
            background: rgba(0,0,0,0.3); color: white; 
            font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; 
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Logic Grid</h1>
        <div id="score" class="score-box">0</div>
        <div id="rate" class="rate-box">Math: 1</div>

        <h3>🛠️ Tools</h3>
        <button id="tool-move" class="btn btn-tool active" onclick="setTool('move')">✋ Move / Merge</button>
        <button id="tool-path" class="btn btn-tool" onclick="setTool('path')">🔗 Path Cable</button>
        <button id="tool-delete" class="btn btn-tool" onclick="setTool('delete')">❌ Remove Cable</button>

        <h3>🛒 Upgrades</h3>
        <button class="btn" id="btn-upgrade-source" onclick="upgradeSource()">
            <div>
                <strong>Upgrade Source</strong><br>
                <small>Base +1</small>
            </div>
            <span>$ <span id="cost-source">10</span></span>
        </button>

        <button class="btn" id="btn-buy-add" onclick="buyCube('adder')">
            <div>
                <strong>Buy Adder</strong><br>
                <small>Adds value</small>
            </div>
            <span>$ <span id="cost-adder">25</span></span>
        </button>

        <button class="btn" id="btn-buy-mult" onclick="buyCube('mult')">
            <div>
                <strong>Buy Multiplier</strong><br>
                <small>Multiplies result</small>
            </div>
            <span>$ <span id="cost-mult">100</span></span>
        </button>

        <div class="controls">
            <button onclick="saveGame()">Save</button>
            <button onclick="resetGame()">Reset</button>
        </div>
        
        <p style="font-size: 0.8rem; color: #6c7086; margin-top: 20px;">
            <strong>How to play:</strong><br>
            1. Buy cubes.<br>
            2. Use ✋ to drag cubes onto grid.<br>
            3. Use 🔗 to click one cube then another to connect them.<br>
            4. Connect chains INTO the source.<br>
            5. Drag same cubes together to merge.
        </p>
    </div>

    <div class="viewport">
        <svg id="connections-layer"></svg>

        <div id="grid" class="grid-container">
            </div>
    </div>

    <script>
        // --- CONSTANTS ---
        const GRID_SIZE = 6;
        const STATS = {
            adder: { base: 1, growth: 1 },
            mult: { base: 1.2, growth: 0.2 }
        };

        // --- STATE ---
        let game = {
            score: 0,
            sourceLvl: 1,
            sourceCost: 10,
            costs: { adder: 25, mult: 100 },
            // Cells: Key "x,y" -> Object { type, level, id }
            gridData: {}, 
            // Connections: Array of { from: "x,y", to: "x,y" }
            connections: []
        };
        
        // Runtime State
        let currentTool = 'move'; // 'move', 'path', 'delete'
        let pathStart = null;     // Stores the first click coordinate for path tool

        // --- UI REFS ---
        const ui = {
            grid: document.getElementById('grid'),
            svg: document.getElementById('connections-layer'),
            score: document.getElementById('score'),
            rate: document.getElementById('rate'),
            costs: {
                source: document.getElementById('cost-source'),
                adder: document.getElementById('cost-adder'),
                mult: document.getElementById('cost-mult')
            }
        };

        // --- INIT ---
        function initGrid() {
            ui.grid.innerHTML = '';
            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    // Events
                    cell.addEventListener('click', () => handleCellClick(x, y));
                    cell.addEventListener('dragover', (e) => e.preventDefault()); // Allow drop
                    cell.addEventListener('drop', (e) => handleDrop(e, x, y));

                    ui.grid.appendChild(cell);
                }
            }
            
            // Ensure source exists
            if (!game.gridData["3,3"]) {
                game.gridData["3,3"] = { type: 'source', level: 1, id: 'src' };
            }
            
            render();
        }

        // --- MATH ENGINE ---

        // Recursive function to calculate value flowing INTO a specific node
        function calculateNodeInput(targetKey, visited = []) {
            // Avoid infinite loops
            if(visited.includes(targetKey)) return 0;

            // Find all connections pointing TO this target
            const incoming = game.connections.filter(c => c.to === targetKey);
            
            if (incoming.length === 0) return 0; // Dead end of chain

            let totalInput = 0;

            incoming.forEach(conn => {
                const sourceKey = conn.from;
                const sourceCube = game.gridData[sourceKey];
                
                if (!sourceCube) return; // Should not happen

                // Get the value flowing into the SOURCE cube (recursive)
                let valueIntoSource = calculateNodeInput(sourceKey, [...visited, targetKey]);

                // Apply the source cube's logic
                if (sourceCube.type === 'adder') {
                    let power = STATS.adder.base + (STATS.adder.growth * (sourceCube.level - 1));
                    // Adders add their power to whatever flowed into them, or just generate power if at start
                    totalInput += (valueIntoSource + power);
                } 
                else if (sourceCube.type === 'mult') {
                    let power = STATS.mult.base + (STATS.mult.growth * (sourceCube.level - 1));
                    // Multipliers multiply the flow. If 0 flow, they do nothing (or we can say they start with 1)
                    let baseFlow = (valueIntoSource === 0) ? 1 : valueIntoSource;
                    totalInput += (baseFlow * power);
                }
            });

            return totalInput;
        }

        function calculateTotal() {
            // Find Source Location
            const sourceKey = Object.keys(game.gridData).find(k => game.gridData[k].type === 'source');
            if(!sourceKey) return 0;

            let incomingValue = calculateNodeInput(sourceKey);
            
            // Final calculation: Source Base + Incoming Chain Value
            return game.sourceLvl + incomingValue;
        }

        // --- INTERACTION ---

        function setTool(tool) {
            currentTool = tool;
            pathStart = null; // reset temp path
            
            // Update UI buttons
            document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            
            render(); // To clear highlights
        }

        function handleCellClick(x, y) {
            const key = `${x},${y}`;
            const cube = game.gridData[key];

            if (currentTool === 'path') {
                if (!cube) return; // Can't start path on empty air

                if (!pathStart) {
                    // Start Drawing
                    pathStart = key;
                    render(); // Highlight start
                } else {
                    // Finish Drawing
                    if (pathStart !== key) {
                        // Prevent duplicates
                        const exists = game.connections.find(c => c.from === pathStart && c.to === key);
                        const reverse = game.connections.find(c => c.from === key && c.to === pathStart);
                        
                        if (!exists && !reverse) {
                            game.connections.push({ from: pathStart, to: key });
                        }
                    }
                    pathStart = null;
                    render();
                }
            }
            else if (currentTool === 'delete') {
                // Remove any connection attached to this cell?
                // Or maybe click the line? (Harder). Let's just clear connections TO or FROM this cell
                // Simple version: Clear all links touching this cell
                game.connections = game.connections.filter(c => c.from !== key && c.to !== key);
                render();
            }
            else if (currentTool === 'move') {
                // Click Source to Gain Points
                if (cube && cube.type === 'source') {
                    let val = calculateTotal();
                    game.score += val;
                    // Pop animation
                    const el = document.querySelector(`.cube[data-key="${key}"]`);
                    if(el) {
                        el.style.transform = "scale(0.9)";
                        setTimeout(()=>el.style.transform = "scale(1)", 100);
                    }
                    updateUI();
                }
            }
        }

        // --- DRAG AND DROP (MERGE & MOVE) ---
        function handleDragStart(e, x, y) {
            if (currentTool !== 'move') {
                e.preventDefault(); 
                return;
            }
            e.dataTransfer.setData("text/plain", `${x},${y}`);
        }

        function handleDrop(e, tx, ty) {
            if (currentTool !== 'move') return;
            e.preventDefault();
            
            const fromData = e.dataTransfer.getData("text/plain").split(',');
            const fx = parseInt(fromData[0]);
            const fy = parseInt(fromData[1]);
            
            const fromKey = `${fx},${fy}`;
            const toKey = `${tx},${ty}`;

            if (fromKey === toKey) return;

            const fromCube = game.gridData[fromKey];
            const toCube = game.gridData[toKey];

            if (!fromCube) return;
            if (fromCube.type === 'source') return; // Cannot move source (optional rule)

            // LOGIC:
            if (!toCube) {
                // Move to empty
                game.gridData[toKey] = fromCube;
                delete game.gridData[fromKey];
                
                // Update connections to follow the move
                game.connections.forEach(c => {
                    if(c.from === fromKey) c.from = toKey;
                    if(c.to === fromKey) c.to = toKey;
                });
            } else if (toCube.type === fromCube.type && toCube.level === fromCube.level) {
                // Merge
                game.gridData[toKey].level++;
                delete game.gridData[fromKey];
                // Remove broken connections from the old cube
                game.connections = game.connections.filter(c => c.from !== fromKey && c.to !== fromKey);
            } else {
                // Swap (Optional, skipped for simplicity here)
                // If you want swap, you need temp var
            }

            render();
            updateUI();
        }

        // --- SHOP ---
        function upgradeSource() {
            if(game.score >= game.sourceCost) {
                game.score -= game.sourceCost;
                game.sourceLvl++;
                game.sourceCost = Math.floor(game.sourceCost * 1.5);
                updateUI();
                render();
            }
        }

        function buyCube(type) {
            const cost = game.costs[type];
            if(game.score < cost) return;

            // Find empty spot
            let placed = false;
            for(let y=0; y<GRID_SIZE; y++) {
                if(placed) break;
                for(let x=0; x<GRID_SIZE; x++) {
                    if(!game.gridData[`${x},${y}`]) {
                        game.score -= cost;
                        game.gridData[`${x},${y}`] = { type: type, level: 1, id: Date.now() };
                        // Increase cost
                        game.costs[type] = Math.ceil(game.costs[type] * 1.3);
                        placed = true;
                        break;
                    }
                }
            }
            if(!placed) alert("Grid full!");
            else {
                updateUI();
                render();
            }
        }

        // --- RENDERERS ---
        function render() {
            // 1. Render Cubes
            // We iterate DOM cells and fill them based on data
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const x = cell.dataset.x;
                const y = cell.dataset.y;
                const key = `${x},${y}`;
                const data = game.gridData[key];

                cell.innerHTML = ''; // clear

                if (data) {
                    const cube = document.createElement('div');
                    cube.className = `cube ${data.type}`;
                    cube.draggable = true;
                    cube.dataset.key = key;
                    
                    // Highlight if path start
                    if (pathStart === key) cube.style.border = "2px dashed white";

                    // Drag Events
                    cube.addEventListener('dragstart', (e) => handleDragStart(e, x, y));

                    // Text
                    let txt = "";
                    if(data.type === 'source') txt = `⚡${game.sourceLvl}`;
                    if(data.type === 'adder') txt = `+${STATS.adder.base + (STATS.adder.growth*(data.level-1))}`;
                    if(data.type === 'mult') txt = `x${(STATS.mult.base + (STATS.mult.growth*(data.level-1))).toFixed(1)}`;
                    
                    cube.innerHTML = `<span class="lvl">${data.level}</span><span class="val">${txt}</span><span class="lbl">${data.type}</span>`;
                    cell.appendChild(cube);
                }
            });

            // 2. Render Lines (SVG)
            drawConnections();
            
            // 3. Update Rates
            updateUI();
        }

        function drawConnections() {
            ui.svg.innerHTML = '';
            
            // Helper to get center of a cell
            const getCenter = (key) => {
                const parts = key.split(',');
                // Find the cell DOM element
                const cell = document.querySelector(`.cell[data-x="${parts[0]}"][data-y="${parts[1]}"]`);
                if (!cell) return {x:0, y:0};
                
                // We need coordinates relative to the svg container
                // But the SVG fills the viewport, so offsetLeft/Top of cell vs viewport
                const rect = cell.getBoundingClientRect();
                const viewRect = document.querySelector('.viewport').getBoundingClientRect();
                
                return {
                    x: (rect.left - viewRect.left) + rect.width/2 + document.querySelector('.viewport').scrollLeft,
                    y: (rect.top - viewRect.top) + rect.height/2 + document.querySelector('.viewport').scrollTop
                };
            };

            game.connections.forEach(conn => {
                const p1 = getCenter(conn.from);
                const p2 = getCenter(conn.to);

                const line = document.createElementNS('http://www.w3.org/2000/svg','line');
                line.setAttribute('x1', p1.x);
                line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x);
                line.setAttribute('y2', p2.y);
                line.setAttribute('stroke', '#585b70');
                line.setAttribute('stroke-width', '4');
                line.setAttribute('marker-end', 'url(#arrow)'); // We need to define marker
                ui.svg.appendChild(line);
            });
            
            // Add Arrow Marker def
            if(!document.getElementById('arrow')) {
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                defs.innerHTML = `<marker id="arrow" markerWidth="10" markerHeight="10" refX="20" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#585b70" /></marker>`;
                ui.svg.appendChild(defs);
            }
        }

        function updateUI() {
            ui.score.textContent = Math.floor(game.score);
            ui.costs.source.textContent = game.sourceCost;
            ui.costs.adder.textContent = game.costs.adder;
            ui.costs.mult.textContent = game.costs.mult;
            ui.rate.textContent = `Current Click Value: ${calculateTotal().toFixed(1)}`;
        }

        // --- SAVE SYSTEM ---
        function saveGame() {
            localStorage.setItem('LogicGridSave', JSON.stringify(game));
            alert("Saved!");
        }
        function loadGame() {
            const d = localStorage.getItem('LogicGridSave');
            if(d) {
                game = JSON.parse(d);
                // Fix missing source if older save
                if(!game.gridData) game.gridData = {};
            }
            initGrid();
        }
        function resetGame() {
            if(confirm("Wipe Save?")) {
                localStorage.removeItem('LogicGridSave');
                location.reload();
            }
        }

        // Boot
        loadGame();

        // Redraw lines on resize
        window.addEventListener('resize', drawConnections);

    </script>
</body>
</html>
