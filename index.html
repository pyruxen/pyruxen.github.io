<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Factory V8 (Directional)</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --grid-line: #292e42;
            --slot-bg: #1f2335;
            --text: #c0caf5;
            --accent-green: #9ece6a;
            --accent-blue: #7aa2f7;
            --accent-red: #f7768e;
            --accent-gold: #e0af68;
            --accent-purple: #bb9af7;
            --dir-indicator: #ff4757;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        /* --- HUD --- */
        .hud-top {
            height: 80px; padding: 15px; box-sizing: border-box;
            display: flex; justify-content: space-between; background: #16161e;
            border-bottom: 1px solid #414868; z-index: 50;
        }
        .hud-left { display: flex; gap: 10px; }
        .score-box {
            background: rgba(26, 27, 38, 0.9); padding: 5px 20px;
            border-radius: 8px; border: 1px solid #414868; text-align: right; min-width: 150px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .score-val { font-size: 1.8rem; font-weight: bold; color: var(--accent-gold); line-height: 1.2; }
        .rate-val { font-family: monospace; color: var(--accent-blue); font-size: 0.85rem; }
        .sec-val { font-family: monospace; color: var(--accent-green); font-size: 0.85rem; }

        /* --- BUTTONS --- */
        .icon-btn {
            width: 50px; height: 50px; background: #24283b;
            border: 2px solid #414868; border-radius: 8px; color: white; font-size: 1.5rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        .icon-btn:hover { background: #414868; }

        #boost-btn {
            width: auto; padding: 0 15px; background: #1a1b26;
            border-color: var(--accent-purple); color: var(--accent-purple);
            font-weight: bold; font-size: 1rem; position: relative; overflow: hidden;
        }
        #boost-btn.active { background: var(--accent-purple); color: #1a1b26; box-shadow: 0 0 15px var(--accent-purple); }

        /* --- VIEWPORT --- */
        .viewport {
            flex: 1; overflow: auto; position: relative; cursor: grab;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .viewport:active { cursor: grabbing; }
        .world-container { position: relative; width: 20000px; height: 10000px; }

        /* --- NODES --- */
        .node-wrapper { 
            position: absolute; width: 100px; height: 100px; 
            display: flex; justify-content: center; align-items: center; z-index: 10; 
        }
        
        .slot {
            width: 90px; height: 90px; background: var(--slot-bg);
            border: 2px solid #414868; border-radius: 12px; position: relative;
            display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        .slot.drag-target { border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); transform: scale(1.05); }

        /* --- CUBES --- */
        .cube {
            width: 82px; height: 82px; border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-weight: bold; box-shadow: 0 5px 10px rgba(0,0,0,0.4); cursor: pointer; z-index: 20; 
            pointer-events: auto; position: relative;
            transition: opacity 0.3s;
            opacity: 0.4; /* Default dimmed (inactive) */
        }
        .cube.active { opacity: 1; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }

        .cube.source { background: var(--accent-gold); color: #1a1b26; border: 2px solid #ff9e64; opacity: 1; }
        .cube.source:active { transform: scale(0.95); }
        .cube.adder { background: var(--accent-blue); color: #1a1b26; border: 2px solid #7dcfff; }
        .cube.mult { background: var(--accent-red); color: #1a1b26; border: 2px solid #ff9e64; }
        
        .cube-val { font-size: 1.4rem; pointer-events: none; }
        .cube-lvl { font-size: 0.7rem; opacity: 0.8; pointer-events: none; }

        /* DIRECTION INDICATOR (Triangle) */
        .dir-arrow {
            position: absolute; width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid var(--dir-indicator);
            /* Centering logic handled in JS rotation */
            pointer-events: none;
        }
        
        /* Positioning classes for arrow */
        .cube[data-dir="up"] .dir-arrow { top: -8px; transform: rotate(0deg); }
        .cube[data-dir="right"] .dir-arrow { right: -8px; top: 35px; transform: rotate(90deg); }
        .cube[data-dir="down"] .dir-arrow { bottom: -8px; transform: rotate(180deg); }
        .cube[data-dir="left"] .dir-arrow { left: -8px; top: 35px; transform: rotate(270deg); }

        /* Source arrows (all sides) */
        .source-arrow {
            position: absolute; width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid #1a1b26;
            pointer-events: none; opacity: 0.5;
        }

        /* --- EXPANSION --- */
        .expand-btn {
            width: 30px; height: 30px; background: #24283b;
            border: 2px dashed #565f89; border-radius: 50%;
            color: #565f89; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: absolute; z-index: 15;
        }
        .expand-btn:hover { background: var(--accent-green); color: #1a1b26; border-color: var(--accent-green); }
        .expand-cost { pointer-events: none; position: absolute; top: -20px; font-size: 0.7rem; color: #1a1b26; background: var(--accent-green); padding: 2px 4px; border-radius: 4px; font-weight: bold;}

        /* --- DOCK --- */
        .shop-dock {
            height: 130px; background: #16161e; border-top: 1px solid #414868;
            display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 100; flex-shrink: 0;
        }
        .shop-item { display: flex; flex-direction: column; align-items: center; cursor: grab; transition: transform 0.1s; }
        .shop-item:hover { transform: translateY(-5px); }
        .shop-icon {
            width: 60px; height: 60px; border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #1a1b26; font-size: 1.5rem; margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .cost-pill { background: #24283b; color: var(--accent-gold); padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; border: 1px solid #414868; }

        /* --- MENU --- */
        .menu-overlay {
            position: absolute; top: 0; left: 0; height: 100vh; width: 350px;
            background: #16161e; border-right: 1px solid #414868;
            transform: translateX(-100%); transition: transform 0.3s; z-index: 200;
            display: flex; flex-direction: column; box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }
        .menu-overlay.open { transform: translateX(0); }
        .menu-header { padding: 20px; border-bottom: 1px solid #414868; display: flex; justify-content: space-between; align-items: center; }
        .menu-content { padding: 20px; overflow-y: auto; flex: 1; }
        .full-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: #24283b; border: 1px solid #414868; color: var(--text); border-radius: 6px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; }
        .full-btn:hover { background: #414868; }

    </style>
</head>
<body>

    <div class="hud-top">
        <div class="hud-left">
            <button class="icon-btn" onclick="toggleMenu()">☰</button>
            <button id="boost-btn" class="icon-btn" onclick="activateBoost()">🚀</button>
        </div>
        <div class="score-box">
            <div id="score" class="score-val">0</div>
            <div id="rate" class="rate-val">Yield: 1</div>
            <div id="sec-rate" class="sec-val">0 / sec</div>
        </div>
    </div>

    <div class="menu-overlay" id="menu">
        <div class="menu-header">
            <h3>Factory OS</h3>
            <button class="icon-btn" style="width: 30px; height: 30px; font-size: 1rem;" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-content">
            <div style="margin-bottom: 30px;">
                <div style="font-size: 0.75rem; color: #565f89; margin-bottom: 10px; font-weight: bold;">UPGRADES</div>
                <button class="full-btn" onclick="upgradeAutoMult()">
                    <div><strong>Auto-Multiplier</strong><br><small id="auto-rate-desc">x0.5 / sec</small></div>
                    <span id="auto-rate-cost">$500</span>
                </button>
            </div>
            <button class="full-btn" onclick="saveGame()">Save Game</button>
            <button class="full-btn" style="border-color: #f7768e; color: #f7768e;" onclick="resetGame()">Reset</button>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="world-container" id="world"></div>
    </div>

    <div class="shop-dock">
        <div class="shop-item" draggable="true" ondragstart="dragStartShop(event, 'adder')">
            <div class="shop-icon" style="background: var(--accent-blue);">+</div>
            <span class="cost-pill" id="cost-adder">25</span>
        </div>
        <div class="shop-item" draggable="true" ondragstart="dragStartShop(event, 'mult')">
            <div class="shop-icon" style="background: var(--accent-red);">x</div>
            <span class="cost-pill" id="cost-mult">100</span>
        </div>
    </div>

    <script>
        const CELL_SIZE = 120;
        const CENTER_X = 10000;
        const CENTER_Y = 5000;
        const STATS = { adder: { base: 1, growth: 1 }, mult: { base: 1.1, growth: 0.1 } };
        const BOOST_DURATION = 30000; const BOOST_COOLDOWN = 1800000;
        const DIRS = ['up', 'right', 'down', 'left'];

        let game = {
            score: 0,
            costs: { adder: 25, mult: 100 },
            autoMult: 0.5, autoCost: 500, lastBoost: 0,
            grid: { "0,0": { unlocked: true, cube: { type: 'source', level: 1, dir: 'all' } } }
        };

        let boostActive = false;
        let activeNodes = new Set(); // Tracks which nodes are receiving power

        const ui = {
            world: document.getElementById('world'),
            viewport: document.getElementById('viewport'),
            score: document.getElementById('score'),
            rate: document.getElementById('rate'),
            secRate: document.getElementById('sec-rate'),
            boostBtn: document.getElementById('boost-btn'),
            menu: document.getElementById('menu'),
            autoDesc: document.getElementById('auto-rate-desc'),
            autoCost: document.getElementById('auto-rate-cost'),
            costs: { adder: document.getElementById('cost-adder'), mult: document.getElementById('cost-mult') }
        };

        // --- GAME LOOP ---
        setInterval(() => {
            let yieldVal = calculateFlow(); // Returns total value of all active endpoints
            
            // Auto Clicker logic
            let totalPerSec = yieldVal * game.autoMult;
            if(boostActive) totalPerSec *= 10;

            if(totalPerSec > 0) {
                game.score += totalPerSec;
                // Pulse Source
                const src = document.querySelector('.cube.source');
                if(src) { src.style.transform = "scale(0.9)"; setTimeout(()=>src.style.transform="scale(1)", 100); }
                updateUI();
            }
            updateBoostBtn();
        }, 1000);

        // --- MATH ENGINE (PUSH SYSTEM) ---
        function calculateFlow() {
            // BFS Propogation
            let totalYield = 0;
            activeNodes.clear();

            // Queue holds: { x, y, value }
            // Start at source with value 1
            let queue = [{x:0, y:0, val: 1}];
            
            // Track visited for this specific tick to prevent infinite loops in circular chains
            let visitedInPath = new Set(); 

            // Simple loop protection: Max steps
            let steps = 0;
            
            while(queue.length > 0 && steps < 1000) {
                let curr = queue.shift();
                let key = `${curr.x},${curr.y}`;
                let cell = game.grid[key];

                if(!cell || !cell.cube) continue;
                
                // Mark as active so it glows
                activeNodes.add(key);

                // Calculate Output Value
                let outputVal = curr.val;
                
                // Logic: If I am an Adder, I add my power to the signal.
                // If I am a Mult, I multiply the signal.
                // Source just passes 1.
                if(cell.cube.type !== 'source') {
                    let power = getPower(cell.cube);
                    if(cell.cube.type === 'adder') outputVal += power;
                    else if(cell.cube.type === 'mult') outputVal *= power;
                    
                    // Add to Total Yield (Every active machine contributes)
                    totalYield += outputVal;
                }

                // Push to neighbors
                // Source pushes to ALL neighbors
                // Others push based on DIR
                let targets = [];

                if(cell.cube.type === 'source') {
                    targets.push({x: curr.x+1, y: curr.y}); // Right
                    targets.push({x: curr.x-1, y: curr.y}); // Left
                    targets.push({x: curr.x, y: curr.y+1}); // Up (Y is up in CSS bottom logic)
                    targets.push({x: curr.x, y: curr.y-1}); // Down
                } else {
                    let d = cell.cube.dir || 'right';
                    if(d === 'right') targets.push({x: curr.x+1, y: curr.y});
                    if(d === 'left') targets.push({x: curr.x-1, y: curr.y});
                    if(d === 'up') targets.push({x: curr.x, y: curr.y+1});
                    if(d === 'down') targets.push({x: curr.x, y: curr.y-1});
                }

                targets.forEach(t => {
                    let tKey = `${t.x},${t.y}`;
                    // Only push if target exists and has a cube
                    if(game.grid[tKey] && game.grid[tKey].cube) {
                        // Loop prevention: In a simple accumulation model, loops explode values.
                        // We need to limit recursion depth or use a dampening factor.
                        // For this idle game, let's just allow flow if not visited in this specific chain branch? 
                        // Simplified: Only process if we haven't processed this node more than once per tick?
                        // Actually, let's just let it flow. The Set 'visitedInPath' checks strict loops.
                        
                        // NOTE: For performance and simplicity, if a node is already in 'activeNodes' this tick, 
                        // we stop to prevent infinite infinite addition.
                        if(!activeNodes.has(tKey)) {
                            queue.push({x: t.x, y: t.y, val: outputVal});
                        }
                    }
                });
                steps++;
            }
            
            // Update Visuals (Dim inactive nodes)
            document.querySelectorAll('.cube').forEach(el => {
                let k = el.dataset.key;
                if(k === "0,0") return; // Source always active
                if(activeNodes.has(k)) el.classList.add('active');
                else el.classList.remove('active');
            });

            return totalYield;
        }

        function getPower(c) {
            if(c.type==='adder') return STATS.adder.base + (STATS.adder.growth*(c.level-1));
            if(c.type==='mult') return STATS.mult.base + (STATS.mult.growth*(c.level-1));
            return 1;
        }

        // --- INTERACTION ---
        
        function rotateCube(x, y) {
            let key = `${x},${y}`;
            let cell = game.grid[key];
            if(!cell || !cell.cube || cell.cube.type === 'source') return; // Source doesn't rotate

            let currentDirIdx = DIRS.indexOf(cell.cube.dir || 'right');
            let nextDir = DIRS[(currentDirIdx + 1) % 4];
            cell.cube.dir = nextDir;
            
            // Redraw just this cube? Or whole world?
            // Simple approach: re-render world to update arrow classes
            renderWorld();
            
            // Recalculate immediate flow visualization
            calculateFlow();
        }

        function unlockSlot(x,y) {
            let cost = getExpCost(x,y);
            if(game.score >= cost) {
                game.score -= cost;
                game.grid[`${x},${y}`] = {unlocked:true, cube:null};
                renderWorld(); updateUI();
            }
        }
        function getExpCost(x,y) {
            let dist = Math.sqrt(x*x + y*y); // Distance from center
            let base = 50;
            return Math.floor(base * Math.pow(dist+1, 2.2));
        }

        // --- DRAG & DROP ---
        function dragStartShop(e, type) { e.dataTransfer.setData('src', 'shop'); e.dataTransfer.setData('type', type); }
        
        function handleDrop(e, x, y) {
            e.preventDefault();
            e.target.classList.remove('drag-target');
            let src = e.dataTransfer.getData('src');
            let type = e.dataTransfer.getData('type');
            let key = `${x},${y}`;
            let cell = game.grid[key];

            if(src === 'shop') {
                let cost = game.costs[type];
                
                // Logic: Buy New or Upgrade
                if(cell.cube && cell.cube.type === type) {
                    if(game.score >= cost) {
                        game.score -= cost;
                        game.costs[type] = Math.ceil(game.costs[type]*1.3);
                        cell.cube.level++;
                        renderWorld(); updateUI();
                    }
                } else if (!cell.cube && game.score >= cost) {
                    game.score -= cost;
                    game.costs[type] = Math.ceil(game.costs[type]*1.3);
                    // Default direction away from center roughly, or just Right
                    cell.cube = {type, level:1, dir: 'right'}; 
                    renderWorld(); updateUI();
                }
            }
        }

        // --- RENDER ---
        function renderWorld() {
            ui.world.innerHTML = '';
            
            let seen = new Set();

            for(let k in game.grid) {
                seen.add(k);
                let [x,y] = k.split(',').map(Number);
                let cell = game.grid[k];

                let wrap = document.createElement('div');
                wrap.className = 'node-wrapper';
                wrap.style.left = (CENTER_X + (x*CELL_SIZE)) + 'px';
                wrap.style.bottom = (CENTER_Y + (y*CELL_SIZE)) + 'px';

                let slot = document.createElement('div');
                slot.className = 'slot';
                slot.ondragover = (e) => { e.preventDefault(); slot.classList.add('drag-target'); };
                slot.ondragleave = () => slot.classList.remove('drag-target');
                slot.ondrop = (e) => handleDrop(e, x, y);

                if(cell.cube) {
                    let c = document.createElement('div');
                    c.className = `cube ${cell.cube.type}`;
                    c.dataset.key = k;
                    // Rotation click
                    c.onclick = () => {
                        if(cell.cube.type === 'source') {
                            // Source click = Manual Harvest
                            let yieldVal = calculateFlow();
                            game.score += (yieldVal || 1);
                            c.style.transform = "scale(0.9)"; 
                            setTimeout(()=>c.style.transform="scale(1)", 100);
                            updateUI();
                        } else {
                            rotateCube(x, y);
                        }
                    };

                    // Add Direction Attribute
                    if(cell.cube.type !== 'source') {
                        c.setAttribute('data-dir', cell.cube.dir || 'right');
                        // Red Triangle
                        let arrow = document.createElement('div');
                        arrow.className = 'dir-arrow';
                        c.appendChild(arrow);
                    } else {
                        // Source has passive arrows indicating flow out
                        ['top: -10px; left: 30px; transform: rotate(0deg)', 
                         'bottom: -10px; left: 30px; transform: rotate(180deg)',
                         'right: -10px; top: 30px; transform: rotate(90deg)',
                         'left: -10px; top: 30px; transform: rotate(270deg)'].forEach(style => {
                            let sa = document.createElement('div');
                            sa.className = 'source-arrow';
                            sa.style.cssText = style;
                            c.appendChild(sa);
                        });
                    }

                    let txt = cell.cube.type==='source' ? "⚡" : (cell.cube.type==='adder' ? `+${getPower(cell.cube)}` : `x${getPower(cell.cube).toFixed(1)}`);
                    let sub = cell.cube.type==='source' ? "Source" : `Lv ${cell.cube.level}`;
                    
                    c.innerHTML += `<span class="cube-val">${txt}</span><span class="cube-lvl">${sub}</span>`;
                    slot.appendChild(c);
                }
                wrap.appendChild(slot);
                ui.world.appendChild(wrap);
            }

            // Expansions (Check neighbors of all unlocked)
            for(let k in game.grid) {
                let [x,y] = k.split(',').map(Number);
                [[0,1],[0,-1],[1,0],[-1,0]].forEach(offset => {
                    let nx = x + offset[0];
                    let ny = y + offset[1];
                    let nk = `${nx},${ny}`;
                    if(!seen.has(nk)) {
                        seen.add(nk); // Prevent duplicate buttons
                        let btn = document.createElement('div');
                        btn.className = 'expand-btn';
                        btn.innerHTML = `+<div class="expand-cost">$${getExpCost(nx,ny)}</div>`;
                        btn.onclick = () => unlockSlot(nx,ny);
                        btn.style.left = (CENTER_X + (nx*CELL_SIZE)+35) + 'px';
                        btn.style.bottom = (CENTER_Y + (ny*CELL_SIZE)+35) + 'px';
                        ui.world.appendChild(btn);
                    }
                });
            }
            
            // Apply active states immediately
            calculateFlow();
        }

        // --- SYSTEM ---
        function upgradeAutoMult() {
            if(game.score >= game.autoCost) {
                game.score -= game.autoCost;
                game.autoMult *= 2; game.autoCost *= 3; updateUI();
            }
        }
        function activateBoost() {
            if(boostActive || Date.now() - game.lastBoost < BOOST_COOLDOWN) return;
            game.lastBoost = Date.now(); boostActive = true; ui.boostBtn.classList.add('active');
            setTimeout(() => { boostActive = false; ui.boostBtn.classList.remove('active'); updateBoostBtn(); }, BOOST_DURATION);
        }
        function updateBoostBtn() {
            if(boostActive) { ui.boostBtn.innerHTML = "🚀 ACTIVE!"; return; }
            let rem = BOOST_COOLDOWN - (Date.now() - game.lastBoost);
            if(rem <= 0) { ui.boostBtn.disabled=false; ui.boostBtn.innerHTML="🚀"; }
            else { ui.boostBtn.disabled=true; ui.boostBtn.innerHTML=`${Math.ceil(rem/60000)}m`; }
        }
        function updateUI() {
            ui.score.textContent = Math.floor(game.score);
            let y = calculateFlow();
            ui.rate.textContent = `Yield: ${y}`;
            let sps = y * game.autoMult * (boostActive ? 10 : 1);
            ui.secRate.textContent = `${sps.toFixed(1)} / sec`;
            ui.costs.adder.textContent = game.costs.adder;
            ui.costs.mult.textContent = game.costs.mult;
            ui.autoDesc.textContent = `x${game.autoMult} / sec`;
            ui.autoCost.textContent = `$${game.autoCost}`;
        }
        function toggleMenu() { ui.menu.classList.toggle('open'); }
        function saveGame() { localStorage.setItem('FV8', JSON.stringify(game)); alert("Saved"); }
        function resetGame() { if(confirm("Reset?")) { localStorage.removeItem('FV8'); location.reload(); } }
        
        window.onload = () => {
            let d = localStorage.getItem('FV8');
            if(d) game = JSON.parse(d);
            renderWorld(); updateUI(); updateBoostBtn();
            ui.viewport.scrollLeft = CENTER_X - window.innerWidth/2;
            ui.viewport.scrollTop = 10000 - CENTER_Y - window.innerHeight/2;
        }
    </script>
</body>
</html>
