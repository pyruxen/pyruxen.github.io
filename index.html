<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Merge Idle</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --slot-bg: #313244;
            --text-color: #cdd6f4;
            --accent-green: #a6e3a1;
            --accent-blue: #89b4fa;
            --accent-red: #f38ba8;
            --accent-gold: #f9e2af;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            user-select: none; /* Prevents text highlighting while dragging */
        }

        /* HEADER */
        header {
            width: 100%;
            padding: 20px;
            background-color: rgba(0,0,0,0.2);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #score-display { font-size: 3rem; font-weight: bold; color: var(--accent-gold); }
        #equation-display { font-family: 'Courier New', monospace; font-size: 1.1rem; color: var(--accent-blue); margin-top: 5px; opacity: 0.8; }

        /* THE CHAIN GRID */
        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow-x: auto;
            padding: 20px;
        }

        .chain-container {
            display: flex;
            flex-direction: row-reverse; /* Slot 0 (Source) is on the Right, mods flow into it */
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        /* SLOTS & CUBES */
        .slot {
            width: 100px;
            height: 100px;
            background-color: var(--slot-bg);
            border-radius: 12px;
            border: 2px dashed #45475a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.2s;
        }
        
        /* Arrows between slots */
        .slot:not(:first-child)::after {
            content: "➜";
            position: absolute;
            right: -25px; /* Points to the next item in row-reverse */
            color: #585b70;
            font-size: 1.5rem;
        }

        .cube {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            font-weight: bold;
            z-index: 2;
        }

        .cube:active { cursor: grabbing; }

        /* Types */
        .cube.source { background-color: var(--accent-gold); color: #1e1e2e; cursor: pointer; border: 3px solid #fab387; }
        .cube.adder { background-color: var(--accent-blue); color: #1e1e2e; border: 2px solid #74c7ec; }
        .cube.multiplier { background-color: var(--accent-red); color: #1e1e2e; border: 2px solid #eba0ac; }

        .lvl-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .cube-val { font-size: 1.4rem; }
        .cube-desc { font-size: 0.7rem; opacity: 0.8; }

        /* SHOP & CONTROLS */
        .ui-panel {
            width: 100%;
            background-color: #313244;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #45475a;
        }

        .btn {
            background-color: #45475a;
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) { background-color: #585b70; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn span.cost { color: var(--accent-gold); font-size: 0.9rem; margin-top: 5px; }

        .btn-red { border-bottom: 3px solid var(--accent-red); }
        .btn-blue { border-bottom: 3px solid var(--accent-blue); }
        .btn-gray { border-bottom: 3px solid #9399b2; }

    </style>
</head>
<body>

    <header>
        <div id="score-display">0</div>
        <div id="equation-display">Equation: Base</div>
    </header>

    <div class="game-area">
        <div class="chain-container" id="grid">
            </div>
    </div>

    <div class="ui-panel">
        <button class="btn btn-blue" id="btn-buy-add" onclick="buyCube('adder')">
            + Adder
            <span class="cost" id="cost-adder">Cost: 10</span>
        </button>

        <button class="btn btn-red" id="btn-buy-mult" onclick="buyCube('multiplier')">
            x Multiplier
            <span class="cost" id="cost-mult">Cost: 50</span>
        </button>

        <button class="btn btn-gray" id="btn-buy-slot" onclick="buySlot()">
            Expand Chain
            <span class="cost" id="cost-slot">Cost: 100</span>
        </button>

        <div style="width: 2px; background: #45475a;"></div>

        <button class="btn" style="min-width: auto;" onclick="resetGame()">♻️ Reset</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Base stats for Level 1 cubes
        const STATS = {
            adder: { base: 1, growth: 1 },         // Lvl 1 adds 1, Lvl 2 adds 2...
            multiplier: { base: 1.1, growth: 0.1 } // Lvl 1 x1.1, Lvl 2 x1.2...
        };

        // --- GAME STATE ---
        let game = {
            score: 0,
            slotsUnlocked: 3, // Start with Source + 2 empty slots
            
            // The Grid: Index 0 is always Source. Others are null or objects.
            grid: [
                { type: 'source', level: 1 } // Index 0
            ],

            costs: {
                adder: 10,
                multiplier: 50,
                slot: 100
            }
        };

        // --- UI ELEMENTS ---
        const ui = {
            score: document.getElementById('score-display'),
            equation: document.getElementById('equation-display'),
            grid: document.getElementById('grid'),
            costs: {
                adder: document.getElementById('cost-adder'),
                mult: document.getElementById('cost-mult'),
                slot: document.getElementById('cost-slot')
            },
            btns: {
                adder: document.getElementById('btn-buy-add'),
                mult: document.getElementById('btn-buy-mult'),
                slot: document.getElementById('btn-buy-slot')
            }
        };

        // --- CORE LOGIC ---

        // Calculate value based on current chain
        function calculateOutput() {
            // Start with Source Value (Base 1)
            let val = 1; 
            let equationText = "1";

            // Loop through slots starting from 1 up to the end
            // We assume the signal flows: Slot N -> ... -> Slot 1 -> Slot 0
            // But mathematically, we apply Slot 1 to Base, then Slot 2 to that result.
            for (let i = 1; i < game.grid.length; i++) {
                const cube = game.grid[i];
                if (cube) {
                    if (cube.type === 'adder') {
                        let power = STATS.adder.base + ((cube.level - 1) * STATS.adder.growth);
                        val += power;
                        equationText = `(${equationText} + ${power})`;
                    } 
                    else if (cube.type === 'multiplier') {
                        let power = STATS.multiplier.base + ((cube.level - 1) * STATS.multiplier.growth);
                        // Rounding to avoid ugly floating point math (1.100000004)
                        power = Math.round(power * 10) / 10;
                        val *= power;
                        equationText = `(${equationText} x ${power})`;
                    }
                }
            }
            return { val, text: equationText };
        }

        function clickSource() {
            const result = calculateOutput();
            game.score += result.val;
            
            // Visual Pop effect
            const sourceEl = document.querySelector('.cube.source');
            sourceEl.style.transform = "scale(0.9)";
            setTimeout(() => sourceEl.style.transform = "scale(1)", 100);

            updateUI();
        }

        // --- SHOP & MERGE LOGIC ---

        function buyCube(type) {
            let cost = type === 'adder' ? game.costs.adder : game.costs.multiplier;
            
            // Check Score
            if (game.score < cost) return;

            // Find first empty slot (skipping 0 because that's source)
            let emptyIndex = -1;
            for(let i=1; i < game.slotsUnlocked; i++) {
                if (!game.grid[i]) {
                    emptyIndex = i;
                    break;
                }
            }

            if (emptyIndex === -1) {
                alert("No empty slots! Expand chain or merge existing cubes.");
                return;
            }

            // Purchase
            game.score -= cost;
            game.grid[emptyIndex] = { type: type, level: 1 };
            
            // Increase price
            if (type === 'adder') game.costs.adder = Math.ceil(game.costs.adder * 1.3);
            else game.costs.multiplier = Math.ceil(game.costs.multiplier * 1.3);

            saveGame();
            renderGrid();
            updateUI();
        }

        function buySlot() {
            if (game.score >= game.costs.slot) {
                game.score -= game.costs.slot;
                game.slotsUnlocked++;
                game.costs.slot *= 2;
                saveGame();
                renderGrid();
                updateUI();
            }
        }

        // --- DRAG AND DROP HANDLERS ---
        
        let draggedIndex = null;

        function handleDragStart(e) {
            draggedIndex = parseInt(e.target.dataset.index);
            e.dataTransfer.effectAllowed = "move";
        }

        function handleDragOver(e) {
            e.preventDefault(); // Necessary to allow dropping
            e.dataTransfer.dropEffect = "move";
        }

        function handleDrop(e) {
            e.preventDefault();
            // Find the closest slot element
            const slot = e.target.closest('.slot');
            if (!slot) return;
            
            const targetIndex = parseInt(slot.dataset.index);

            // Cannot interact with Source (Index 0)
            if (draggedIndex === 0 || targetIndex === 0) return;
            if (draggedIndex === targetIndex) return;

            const sourceCube = game.grid[draggedIndex];
            const targetCube = game.grid[targetIndex];

            // LOGIC: MERGE, MOVE, or SWAP
            if (!targetCube) {
                // MOVE: Target is empty
                game.grid[targetIndex] = sourceCube;
                game.grid[draggedIndex] = null;
            } else if (sourceCube.type === targetCube.type && sourceCube.level === targetCube.level) {
                // MERGE: Same type and level
                game.grid[targetIndex].level += 1;
                game.grid[draggedIndex] = null;
            } else {
                // SWAP: Different cubes
                game.grid[targetIndex] = sourceCube;
                game.grid[draggedIndex] = targetCube;
            }

            saveGame();
            renderGrid();
            updateUI();
        }

        // --- RENDER & UPDATE ---

        function renderGrid() {
            ui.grid.innerHTML = '';
            
            // Create slots up to unlocked limit
            // Note: Data is stored in game.grid. If game.grid[i] is undefined, it's empty.
            for (let i = 0; i < game.slotsUnlocked; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                
                // Add Drag Drop Listeners to Slot
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('drop', handleDrop);

                const cubeData = game.grid[i];

                if (cubeData) {
                    const cube = document.createElement('div');
                    cube.className = `cube ${cubeData.type}`;
                    cube.draggable = (i !== 0); // Source not draggable
                    cube.dataset.index = i;
                    
                    if (i !== 0) cube.addEventListener('dragstart', handleDragStart);
                    if (i === 0) cube.onclick = clickSource;

                    // Calculate Display Text
                    let valText = "";
                    if (cubeData.type === 'source') valText = "⚡";
                    else if (cubeData.type === 'adder') valText = "+" + (STATS.adder.base + (cubeData.level-1)*STATS.adder.growth);
                    else if (cubeData.type === 'multiplier') valText = "x" + (Math.round((STATS.multiplier.base + (cubeData.level-1)*STATS.multiplier.growth)*10)/10);

                    cube.innerHTML = `
                        <span class="lvl-badge">Lv ${cubeData.level}</span>
                        <span class="cube-val">${valText}</span>
                        <span class="cube-desc">${cubeData.type}</span>
                    `;
                    slot.appendChild(cube);
                }

                ui.grid.appendChild(slot);
            }
        }

        function updateUI() {
            ui.score.textContent = Math.floor(game.score);
            
            const result = calculateOutput();
            ui.equation.textContent = `Formula: ${result.text} = ${result.val.toFixed(1)} per click`;

            ui.costs.adder.textContent = `Cost: ${game.costs.adder}`;
            ui.costs.mult.textContent = `Cost: ${game.costs.multiplier}`;
            ui.costs.slot.textContent = `Cost: ${game.costs.slot}`;

            ui.btns.adder.disabled = game.score < game.costs.adder;
            ui.btns.mult.disabled = game.score < game.costs.multiplier;
            ui.btns.slot.disabled = game.score < game.costs.slot;
        }

        // --- SAVE SYSTEM ---
        function saveGame() {
            localStorage.setItem('ModularIdleSave', JSON.stringify(game));
        }

        function loadGame() {
            const saved = JSON.parse(localStorage.getItem('ModularIdleSave'));
            if (saved) {
                game = saved;
                // Ensure array length matches unlocked slots if corrupted
                while(game.grid.length < game.slotsUnlocked) game.grid.push(null);
            }
        }

        function resetGame() {
            if(confirm("Reset everything?")) {
                localStorage.removeItem('ModularIdleSave');
                location.reload();
            }
        }

        // Init
        loadGame();
        renderGrid();
        updateUI();

    </script>
</body>
</html>
