<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Clicker: Save & Load Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .layout {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            height: 70vh; /* Fixed height to allow scrolling in shop */
        }

        /* --- LEFT SIDE: The Clicker --- */
        .game-area {
            flex: 1;
            text-align: center;
            background-color: #34495e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #score-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .stats {
            color: #bdc3c7;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        #click-btn {
            background-color: #e74c3c;
            border: none;
            color: white;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 8px 0 #c0392b;
            outline: none;
        }

        #click-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #c0392b;
        }

        /* --- RIGHT SIDE: The Shop --- */
        .shop-area {
            flex: 1;
            background-color: #2ecc71;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .shop-items {
            overflow-y: auto; /* Allows scrolling if list gets long */
            flex-grow: 1;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
        }

        .upgrade-btn {
            background-color: white;
            color: #2c3e50;
            border: none;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-btn:hover {
            background-color: #ecf0f1;
        }

        .upgrade-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #bdc3c7;
        }

        .cost {
            font-weight: bold;
            color: #e67e22;
        }

        /* --- FOOTER: Settings --- */
        .settings-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #reset-btn {
            background-color: #95a5a6;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        #reset-btn:hover {
            background-color: #7f8c8d;
        }

        #save-status {
            color: #bdc3c7;
            font-size: 0.8rem;
            margin-left: 10px;
            align-self: center;
        }
    </style>
</head>
<body>

    <div class="layout">
        <div class="game-area">
            <h1>Super Clicker</h1>
            <div id="score-display">0</div>
            <div class="stats">
                <div id="per-click-display">Per Click: 1</div>
                <div id="per-second-display">Per Second: 0</div>
            </div>
            <button id="click-btn">CLICK!</button>
        </div>

        <div class="shop-area">
            <h2>🛒 Upgrade Shop</h2>
            <div class="shop-items">
                <button id="buy-cursor" class="upgrade-btn" onclick="buyCursor()">
                    <div>
                        <strong>💪 Stronger Clicks</strong><br>
                        <small>+1 score per click</small>
                    </div>
                    <div class="cost" id="cursor-cost">Cost: 10</div>
                </button>

                <button id="buy-auto" class="upgrade-btn" onclick="buyAutoClicker()">
                    <div>
                        <strong>🤖 Auto Bot</strong><br>
                        <small>+1 score per second</small>
                    </div>
                    <div class="cost" id="auto-cost">Cost: 50</div>
                </button>
            </div>
        </div>
    </div>

    <div class="settings-area">
        <button id="reset-btn" onclick="resetGame()">⚠️ Reset Progress</button>
        <span id="save-status">Game saved.</span>
    </div>

    <script>
        // --- GAME VARIABLES ---
        // We set default values, but we might overwrite them in the loadGame() function
        let gameData = {
            score: 0,
            clickPower: 1,
            cursorCost: 10,
            autoClickers: 0,
            autoClickerCost: 50
        };

        // --- DOM ELEMENTS ---
        const scoreDisplay = document.getElementById('score-display');
        const clickBtn = document.getElementById('click-btn');
        const perClickDisplay = document.getElementById('per-click-display');
        const perSecondDisplay = document.getElementById('per-second-display');
        
        const buyCursorBtn = document.getElementById('buy-cursor');
        const cursorCostDisplay = document.getElementById('cursor-cost');
        
        const buyAutoBtn = document.getElementById('buy-auto');
        const autoCostDisplay = document.getElementById('auto-cost');
        
        const saveStatus = document.getElementById('save-status');

        // --- CORE FUNCTIONS ---

        // 1. The Main Click
        clickBtn.addEventListener('click', () => {
            gameData.score += gameData.clickPower;
            updateUI();
        });

        // 2. Buy Functions
        function buyCursor() {
            if (gameData.score >= gameData.cursorCost) {
                gameData.score -= gameData.cursorCost;
                gameData.clickPower++;
                gameData.cursorCost = Math.ceil(gameData.cursorCost * 1.5);
                updateUI();
                saveGame(); // Save immediately on purchase
            }
        }

        function buyAutoClicker() {
            if (gameData.score >= gameData.autoClickerCost) {
                gameData.score -= gameData.autoClickerCost;
                gameData.autoClickers++;
                gameData.autoClickerCost = Math.ceil(gameData.autoClickerCost * 1.5);
                updateUI();
                saveGame(); // Save immediately on purchase
            }
        }

        // 3. The Game Loop (Run every second)
        setInterval(() => {
            if (gameData.autoClickers > 0) {
                gameData.score += gameData.autoClickers;
                updateUI();
            }
        }, 1000);
        
        // 4. Auto-Save Loop (Runs every 30 seconds)
        setInterval(() => {
            saveGame();
        }, 30000);

        // --- SAVE / LOAD SYSTEM ---

        function saveGame() {
            // Convert our object to a string and save it to browser storage
            localStorage.setItem('myClickerSave', JSON.stringify(gameData));
            
            // Show a little "Saved" animation
            saveStatus.textContent = "Game Saved!";
            saveStatus.style.opacity = 1;
            setTimeout(() => { saveStatus.style.opacity = 0.5; }, 1000);
        }

        function loadGame() {
            // Check if a save exists
            const savedGame = JSON.parse(localStorage.getItem('myClickerSave'));
            
            if (savedGame) {
                // If it exists, update our variables
                gameData = savedGame;
            }
        }

        function resetGame() {
            // A popup to confirm they really want to delete
            if (confirm("Are you sure you want to reset your progress? This cannot be undone.")) {
                localStorage.removeItem('myClickerSave'); // Delete the save
                location.reload(); // Refresh the page
            }
        }

        // --- UPDATE UI ---
        function updateUI() {
            scoreDisplay.textContent = Math.floor(gameData.score); // floor removes decimals
            perClickDisplay.textContent = `Per Click: ${gameData.clickPower}`;
            perSecondDisplay.textContent = `Per Second: ${gameData.autoClickers}`;

            cursorCostDisplay.textContent = `Cost: ${gameData.cursorCost}`;
            autoCostDisplay.textContent = `Cost: ${gameData.autoClickerCost}`;

            buyCursorBtn.disabled = gameData.score < gameData.cursorCost;
            buyAutoBtn.disabled = gameData.score < gameData.autoClickerCost;
        }

        // --- INITIALIZATION ---
        // When the page loads, try to load the save, then update the screen
        loadGame();
        updateUI();

    </script>
</body>
</html>
