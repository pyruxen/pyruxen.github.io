<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Idle Game</title>
    <style>
        /* CSS: This controls how the game looks */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
            background-color: #34495e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
        }

        #score-display {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
            color: #f1c40f; /* Yellow color for the score */
        }

        #click-btn {
            background-color: #e74c3c;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 5px 0 #c0392b; /* Creates a 3D button effect */
        }

        /* Animation when clicking */
        #click-btn:active {
            transform: translateY(4px); /* Moves button down */
            box-shadow: 0 1px 0 #c0392b; /* Reduces shadow size */
        }

        #click-btn:hover {
            background-color: #ec7063;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Clicker Game</h1>
        <div id="score-display">0</div>
        <button id="click-btn">CLICK ME!</button>
    </div>

    <script>
        // JavaScript: This controls the game logic
        
        // 1. Select the elements we need to change
        const scoreDisplay = document.getElementById('score-display');
        const clickButton = document.getElementById('click-btn');

        // 2. Initialize the score variable
        let score = 0;

        // 3. Define what happens when the button is clicked
        clickButton.addEventListener('click', () => {
            // Increase the score by 1
            score = score + 1;
            
            // Update the text on the screen
            scoreDisplay.textContent = score;
        });
    </script>

</body>
</html>
