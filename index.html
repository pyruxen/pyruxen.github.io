<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Factory Idle</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --panel-bg: #24283b;
            --accent-gold: #e0af68;
            --accent-blue: #7aa2f7;
            --accent-red: #f7768e;
            --accent-purple: #bb9af7;
            --text-main: #c0caf5;
            --slot-empty: #414868;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* --- HEADER --- */
        header {
            background-color: var(--panel-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .score-container { text-align: left; }
        .score-val { font-size: 2.5rem; font-weight: bold; color: var(--accent-gold); line-height: 1; }
        .score-rate { font-family: monospace; color: var(--accent-blue); font-size: 1rem; margin-top: 5px; }
        
        .controls button {
            background: #565f89; border: none; padding: 8px 15px; 
            color: white; border-radius: 4px; cursor: pointer; margin-left: 10px;
        }
        .controls button:hover { background: #7aa2f7; }

        /* --- MAIN SCROLLABLE AREA --- */
        .factory-viewport {
            flex: 1;
            overflow-x: auto; /* Allows horizontal scrolling */
            overflow-y: hidden;
            display: flex;
            align-items: center;
            /* We use row-reverse so Source is on the Right, and we expand Leftwards */
            flex-direction: row-reverse; 
            padding: 50px;
            background-image: linear-gradient(var(--bg-color) 1px, transparent 1px), linear-gradient(90deg, var(--bg-color) 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #16161e;
        }

        /* --- THE COLUMNS --- */
        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 20px;
            position: relative;
            flex-shrink: 0; /* Prevents squishing */
        }

        /* Connector Lines */
        .column:not(:first-child)::after {
            content: "➜"; /* Arrow pointing right (towards source in row-reverse) */
            position: absolute;
            top: 135px; /* Aligns with bottom row */
            right: -30px;
            font-size: 2rem;
            color: #565f89;
            z-index: 0;
        }

        .branch-connector {
            width: 4px;
            height: 30px;
            background-color: #565f89;
            margin: 5px 0;
            opacity: 0.3;
        }
        .branch-connector.active { opacity: 1; background-color: var(--accent-purple); }

        /* --- SLOTS --- */
        .slot {
            width: 100px;
            height: 100px;
            background-color: var(--slot-empty);
            border-radius: 12px;
            border: 2px dashed #565f89;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.2s;
        }

        .slot.drag-over { background-color: #7aa2f7; border-color: white; transform: scale(1.1); }
        .slot.is-branch { border-color: var(--accent-purple); opacity: 0.6; }
        .slot.is-branch:hover { opacity: 1; }
        
        .slot-label {
            position: absolute;
            bottom: -25px;
            font-size: 0.8rem;
            color: #565f89;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* --- CUBES --- */
        .cube {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-weight: bold;
            z-index: 2;
            cursor: grab;
            position: relative;
        }
        
        .cube:active { cursor: grabbing; }

        .cube.source { background: var(--accent-gold); color: #1a1b26; border: 2px solid #ff9e64; cursor: pointer; }
        .cube.source:active { transform: scale(0.95); }

        .cube.adder { background: var(--accent-blue); color: #1a1b26; border: 2px solid #7dcfff; }
        .cube.mult { background: var(--accent-red); color: #1a1b26; border: 2px solid #ff9e64; }

        .cube-val { font-size: 1.5rem; }
        .cube-type { font-size: 0.7rem; text-transform: uppercase; opacity: 0.8; }
        .cube-lvl { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.3); color: white; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; }

        /* --- DRAG SHOP (BOTTOM DOCK) --- */
        .shop-dock {
            height: 160px;
            background-color: var(--panel-bg);
            border-top: 4px solid #16161e;
            display: flex;
            align-items: center;
            padding: 0 40px;
            gap: 40px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            transition: transform 0.2s;
            position: relative;
        }
        .shop-item:hover { transform: translateY(-5px); }
        .shop-item:active { cursor: grabbing; }

        .shop-preview {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .cost-tag {
            background-color: #16161e;
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .dock-separator { width: 1px; height: 60%; background: #565f89; }

        .shop-btn {
            background: #414868; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-size: 1rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .shop-btn:hover { background: #565f89; }
        .shop-btn small { color: var(--accent-gold); margin-top: 5px; }

    </style>
</head>
<body>

    <header>
        <div class="score-container">
            <div id="score" class="score-val">0</div>
            <div id="rate" class="score-rate">Per Click: 1</div>
        </div>
        <div class="controls">
            <button onclick="saveGame()">Save</button>
            <button onclick="resetGame()">Reset</button>
        </div>
    </header>

    <div class="factory-viewport" id="chain-container">
        </div>

    <div class="shop-dock">
        
        <div class="shop-item" draggable="true" ondragstart="dragStart(event, 'adder')">
            <div class="shop-preview" style="background: var(--accent-blue); color: #1a1b26;">+</div>
            <span class="cost-tag" id="cost-adder">$25</span>
        </div>

        <div class="shop-item" draggable="true" ondragstart="dragStart(event, 'mult')">
            <div class="shop-preview" style="background: var(--accent-red); color: #1a1b26;">x</div>
            <span class="cost-tag" id="cost-mult">$100</span>
        </div>

        <div class="dock-separator"></div>

        <button class="shop-btn" onclick="buyExpansion()">
            Extend Line
            <small id="cost-expand">$50</small>
        </button>

    </div>

    <script>
        // --- CONSTANTS ---
        const STATS = {
            adder: { base: 1, growth: 1 },
            mult: { base: 1.1, growth: 0.1 }
        };

        // --- GAME STATE ---
        let game = {
            score: 0,
            expandCost: 50,
            costs: { adder: 25, mult: 100 },
            
            // The Chain is an array of Columns.
            // Index 0 is the Source (Rightmost). Index 1 is the first machine, etc.
            chain: [
                { id: 'source', main: { type: 'source', level: 1 }, branch: null }
            ]
        };

        // --- UI REFERENCES ---
        const ui = {
            score: document.getElementById('score'),
            rate: document.getElementById('rate'),
            container: document.getElementById('chain-container'),
            costs: {
                adder: document.getElementById('cost-adder'),
                mult: document.getElementById('cost-mult'),
                expand: document.getElementById('cost-expand')
            }
        };

        // --- CORE LOGIC ---

        function calculateChain() {
            // Start with Source Base Value
            let totalPerClick = game.chain[0].main.level; // Source Level = Base Value
            
            // Iterate backwards from the end of the array (Leftmost items) towards 0 (Source)
            // Or forwards? In logic: Slot 2 feeds Slot 1 feeds Source.
            // We apply math sequentially.
            
            // Let's model it: Flow Value accumulates as we walk towards Source.
            // But usually in these games, modifiers act on the Source's base.
            // Let's try: Source generates X. Slot 1 modifies X. Slot 2 modifies result.
            // Wait, the visual flow is Left -> Right -> Source.
            // So Slot N (Far Left) starts the chain? Or does Source pull?
            
            // Let's do "Pull" logic.
            // Source produces Base.
            // Slot 1 (closest) modifies that.
            // Slot 2 modifies that result.
            
            for (let i = 1; i < game.chain.length; i++) {
                const col = game.chain[i];
                if (!col.main) continue; // Empty slot, ignore

                // 1. Calculate the power of this Main Node
                let nodePower = 0; 
                let nodeIsMult = false;

                if (col.main.type === 'adder') {
                    nodePower = STATS.adder.base + (STATS.adder.growth * (col.main.level - 1));
                    nodeIsMult = false;
                } else if (col.main.type === 'mult') {
                    nodePower = STATS.mult.base + (STATS.mult.growth * (col.main.level - 1));
                    nodeIsMult = true;
                }

                // 2. Check for Branch (Modifier)
                if (col.branch) {
                    let branchPower = 0;
                    // Branch logic: Modifies the Node Power
                    if (col.branch.type === 'adder') {
                        branchPower = STATS.adder.base + (STATS.adder.growth * (col.branch.level - 1));
                        nodePower += branchPower; // Add to the main node's power
                    } else if (col.branch.type === 'mult') {
                        branchPower = STATS.mult.base + (STATS.mult.growth * (col.branch.level - 1));
                        nodePower *= branchPower; // Multiply the main node's power
                    }
                }

                // 3. Apply Main Node to Total Flow
                if (nodeIsMult) {
                    totalPerClick *= nodePower;
                } else {
                    totalPerClick += nodePower;
                }
            }

            return totalPerClick;
        }

        function clickSource() {
            const val = calculateChain();
            game.score += val;
            
            // Animation on Source
            const srcBtn = document.querySelector('.cube.source');
            if(srcBtn) {
                srcBtn.style.transform = "scale(0.9)";
                setTimeout(() => srcBtn.style.transform = "scale(1)", 100);
            }
            updateUI();
        }

        // --- SHOP & EXPANSION ---

        function buyExpansion() {
            if (game.score >= game.expandCost) {
                game.score -= game.expandCost;
                game.expandCost = Math.floor(game.expandCost * 1.5);
                
                // Add new empty column
                game.chain.push({ main: null, branch: null });
                
                renderChain();
                updateUI();
            }
        }

        function handlePurchase(type, colIndex, isBranch) {
            const cost = game.costs[type];
            if (game.score < cost) return false;

            // Deduct Cost
            game.score -= cost;
            game.costs[type] = Math.ceil(game.costs[type] * 1.3);

            // Create Cube
            const newCube = { type: type, level: 1 };
            
            if (isBranch) {
                game.chain[colIndex].branch = newCube;
            } else {
                game.chain[colIndex].main = newCube;
            }

            updateUI();
            renderChain();
            return true;
        }

        // --- DRAG AND DROP HANDLERS ---
        
        function dragStart(ev, type) {
            ev.dataTransfer.setData("type", type);
            ev.dataTransfer.effectAllowed = "copy";
        }

        function allowDrop(ev) {
            ev.preventDefault();
            // Optional: highlight slot
            ev.target.closest('.slot').classList.add('drag-over');
        }
        
        function dragLeave(ev) {
            ev.target.closest('.slot').classList.remove('drag-over');
        }

        function drop(ev, colIndex, isBranch) {
            ev.preventDefault();
            ev.target.closest('.slot').classList.remove('drag-over');
            
            const type = ev.dataTransfer.getData("type");
            const targetCol = game.chain[colIndex];
            
            const existing = isBranch ? targetCol.branch : targetCol.main;

            if (!existing) {
                // Buy New
                handlePurchase(type, colIndex, isBranch);
            } else {
                // Merge logic (if dragging same type)
                // NOTE: This basic drag only supports Shop -> Grid. 
                // To support Grid -> Grid merge, we need more complex dataTransfer.
                // For now, if slot is full, do nothing (or we could implement Upgrade-by-Buying).
                
                if (existing.type === type) {
                    const cost = game.costs[type];
                    if (game.score >= cost) {
                         // Upgrade existing by paying cost
                         game.score -= cost;
                         game.costs[type] = Math.ceil(game.costs[type] * 1.3);
                         existing.level++;
                         updateUI();
                         renderChain();
                    }
                }
            }
        }

        // --- RENDER ---

        function renderChain() {
            ui.container.innerHTML = '';

            game.chain.forEach((col, index) => {
                const columnDiv = document.createElement('div');
                columnDiv.className = 'column';

                // 1. Branch Slot (Top)
                const branchSlot = document.createElement('div');
                branchSlot.className = 'slot is-branch';
                if (index === 0) branchSlot.style.visibility = 'hidden'; // Source has no branch in this simple model
                
                if (index !== 0) {
                    branchSlot.ondragover = allowDrop;
                    branchSlot.ondragleave = dragLeave;
                    branchSlot.ondrop = (e) => drop(e, index, true);
                    
                    if (col.branch) {
                        branchSlot.appendChild(createCubeEl(col.branch));
                        branchSlot.style.borderStyle = "solid";
                    } else {
                         branchSlot.innerHTML = `<span class="slot-label">Branch</span>`;
                    }
                }

                // 2. Connector Line
                const connector = document.createElement('div');
                connector.className = 'branch-connector ' + (col.branch ? 'active' : '');

                // 3. Main Slot (Bottom)
                const mainSlot = document.createElement('div');
                mainSlot.className = 'slot';
                
                if (index === 0) {
                    // Source
                    const srcCube = createCubeEl(col.main);
                    srcCube.onclick = clickSource;
                    mainSlot.appendChild(srcCube);
                    mainSlot.style.border = "none";
                    mainSlot.style.background = "transparent";
                } else {
                    mainSlot.ondragover = allowDrop;
                    mainSlot.ondragleave = dragLeave;
                    mainSlot.ondrop = (e) => drop(e, index, false);

                    if (col.main) {
                        mainSlot.appendChild(createCubeEl(col.main));
                        mainSlot.style.borderStyle = "solid";
                    } else {
                        mainSlot.innerHTML = `<span class="slot-label">Main</span>`;
                    }
                }

                columnDiv.appendChild(branchSlot);
                columnDiv.appendChild(connector);
                columnDiv.appendChild(mainSlot);

                ui.container.appendChild(columnDiv);
            });
        }

        function createCubeEl(data) {
            const div = document.createElement('div');
            div.className = `cube ${data.type}`;
            
            let symbol = "";
            let val = 0;
            
            if (data.type === 'source') {
                symbol = "⚡";
                val = data.level;
            } else if (data.type === 'adder') {
                symbol = "+";
                val = STATS.adder.base + (STATS.adder.growth * (data.level - 1));
            } else if (data.type === 'mult') {
                symbol = "x";
                val = (STATS.mult.base + (STATS.mult.growth * (data.level - 1))).toFixed(1);
            }

            div.innerHTML = `
                <span class="cube-lvl">Lv${data.level}</span>
                <span class="cube-val">${val}</span>
                <span class="cube-type">${symbol}</span>
            `;
            return div;
        }

        function updateUI() {
            ui.score.textContent = Math.floor(game.score);
            ui.rate.textContent = `Yield: ${calculateChain().toFixed(1)}`;
            
            ui.costs.adder.textContent = `$${game.costs.adder}`;
            ui.costs.mult.textContent = `$${game.costs.mult}`;
            ui.costs.expand.textContent = `$${game.expandCost}`;
        }

        // --- SAVE SYSTEM ---
        function saveGame() {
            localStorage.setItem('FishboneSave', JSON.stringify(game));
            alert("Game Saved");
        }
        
        function resetGame() {
            if(confirm("Reset?")) {
                localStorage.removeItem('FishboneSave');
                location.reload();
            }
        }
        
        function loadGame() {
            const d = localStorage.getItem('FishboneSave');
            if (d) {
                game = JSON.parse(d);
            }
            renderChain();
            updateUI();
        }

        // Init
        loadGame();

    </script>
</body>
</html>
