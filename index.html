<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Clicker with Shop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevents scrolling */
        }

        .layout {
            display: flex;
            gap: 20px;
            margin-top: 50px;
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        /* --- LEFT SIDE: The Clicker --- */
        .game-area {
            flex: 1;
            text-align: center;
            background-color: #34495e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #score-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .stats {
            color: #bdc3c7;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        #click-btn {
            background-color: #e74c3c;
            border: none;
            color: white;
            width: 200px;
            height: 200px;
            border-radius: 50%; /* Makes it a circle */
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 8px 0 #c0392b;
            outline: none;
        }

        #click-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #c0392b;
        }

        /* --- RIGHT SIDE: The Shop --- */
        .shop-area {
            flex: 1;
            background-color: #2ecc71;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
        }

        .upgrade-btn {
            background-color: white;
            color: #2c3e50;
            border: none;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-btn:hover {
            background-color: #ecf0f1;
        }

        .upgrade-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #bdc3c7;
        }

        .cost {
            font-weight: bold;
            color: #e67e22;
        }
    </style>
</head>
<body>

    <div class="layout">
        <div class="game-area">
            <h1>Super Clicker</h1>
            <div id="score-display">0</div>
            <div class="stats">
                <div id="per-click-display">Per Click: 1</div>
                <div id="per-second-display">Per Second: 0</div>
            </div>
            <button id="click-btn">CLICK!</button>
        </div>

        <div class="shop-area">
            <h2>🛒 Upgrade Shop</h2>
            
            <button id="buy-cursor" class="upgrade-btn" onclick="buyCursor()">
                <div>
                    <strong>💪 Stronger Clicks</strong><br>
                    <small>+1 score per click</small>
                </div>
                <div class="cost" id="cursor-cost">Cost: 10</div>
            </button>

            <button id="buy-auto" class="upgrade-btn" onclick="buyAutoClicker()">
                <div>
                    <strong>🤖 Auto Bot</strong><br>
                    <small>+1 score per second</small>
                </div>
                <div class="cost" id="auto-cost">Cost: 50</div>
            </button>
        </div>
    </div>

    <script>
        // --- GAME VARIABLES ---
        let score = 0;
        
        let clickPower = 1;      // How much you get per click
        let cursorCost = 10;     // Cost to upgrade click

        let autoClickers = 0;    // How many auto clickers you have
        let autoClickerCost = 50; // Cost to buy an auto clicker

        // --- DOM ELEMENTS ---
        const scoreDisplay = document.getElementById('score-display');
        const clickBtn = document.getElementById('click-btn');
        const perClickDisplay = document.getElementById('per-click-display');
        const perSecondDisplay = document.getElementById('per-second-display');
        
        const buyCursorBtn = document.getElementById('buy-cursor');
        const cursorCostDisplay = document.getElementById('cursor-cost');
        
        const buyAutoBtn = document.getElementById('buy-auto');
        const autoCostDisplay = document.getElementById('auto-cost');

        // --- CORE FUNCTIONS ---

        // 1. The Main Click
        clickBtn.addEventListener('click', () => {
            score += clickPower; // Add current power to score
            updateUI();
        });

        // 2. Buy "Stronger Clicks" Upgrade
        function buyCursor() {
            if (score >= cursorCost) {
                score -= cursorCost;            // Pay the cost
                clickPower++;                   // Increase power
                cursorCost = Math.ceil(cursorCost * 1.5); // Increase cost for next time
                updateUI();
            }
        }

        // 3. Buy "Auto Bot" Upgrade
        function buyAutoClicker() {
            if (score >= autoClickerCost) {
                score -= autoClickerCost;       // Pay the cost
                autoClickers++;                 // Increase amount of bots
                autoClickerCost = Math.ceil(autoClickerCost * 1.5); // Increase cost
                updateUI();
            }
        }

        // 4. The "Game Loop" (Runs once every second)
        setInterval(() => {
            if (autoClickers > 0) {
                score += autoClickers;
                updateUI();
            }
        }, 1000); // 1000 milliseconds = 1 second

        // 5. Update the User Interface (Text and Buttons)
        function updateUI() {
            scoreDisplay.textContent = score;
            perClickDisplay.textContent = `Per Click: ${clickPower}`;
            perSecondDisplay.textContent = `Per Second: ${autoClickers}`;

            // Update Shop Prices
            cursorCostDisplay.textContent = `Cost: ${cursorCost}`;
            autoCostDisplay.textContent = `Cost: ${autoClickerCost}`;

            // Disable buttons if you can't afford them
            buyCursorBtn.disabled = score < cursorCost;
            buyAutoBtn.disabled = score < autoClickerCost;
        }

        // Run once at start to set initial text
        updateUI();

    </script>
</body>
</html>
